<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEOSHY Vault — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0a0e17;
      --panel: rgba(16, 22, 36, 0.55);
      --border-cyan: rgba(59, 158, 255, 0.28);
      --cyan: #3b9eff;
      --blue: #0078e0;
      --red: #f87171;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --font-main: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    *::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }

    body {
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 50% 0%, rgba(59, 158, 255, 0.15) 0%, transparent 65%),
        radial-gradient(circle at 80% 50%, rgba(0, 120, 224, 0.08) 0%, transparent 50%);
      color: var(--text); font-family: var(--font-main); min-height: 100vh;
    }

    .neo-card {
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.02));
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.15);
    }
    .neo-input {
      background: rgba(10, 14, 23, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
      color: #fff; border-radius: 12px; padding: 11px 14px; width: 100%;
      font-size: 14px; outline: none; font-family: var(--font-main);
      backdrop-filter: blur(8px);
    }
    .neo-input:focus {
      border-color: rgba(59, 158, 255, 0.45);
      box-shadow: 0 0 12px rgba(59, 158, 255, 0.2);
    }
    .neo-input:disabled { opacity: 0.5; cursor: not-allowed; }
    .neo-btn {
      background: linear-gradient(135deg, rgba(59, 158, 255, 0.85), rgba(0, 120, 224, 0.75));
      box-shadow: 0 4px 20px rgba(0, 120, 224, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.25);
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.2); color: #0a0e17; font-weight: 700; padding: 11px 18px;
      border-radius: 12px; font-size: 14px; cursor: pointer; font-family: var(--font-main);
    }
    .neo-btn:hover { box-shadow: 0 6px 28px rgba(0, 120, 224, 0.35); transform: translateY(-1px); }
    .neo-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* LOGIN */
    #loginScreen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .login-box { width: 100%; max-width: 400px; padding: 32px 28px; border-radius: 20px; text-align: center; }
    .hero-logo-wrapper {
      position: relative; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px;
    }
    .hero-logo-wrapper::before {
      content: ''; position: absolute; width: 120px; height: 120px;
      background: radial-gradient(circle, rgba(59, 158, 255, 0.3) 0%, rgba(0, 120, 224, 0.1) 50%, transparent 70%);
      filter: blur(28px); z-index: 0; animation: pulseGlow 3.5s ease-in-out infinite alternate;
    }
    .logo-card {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px) saturate(1.5); -webkit-backdrop-filter: blur(20px) saturate(1.5);
      border-radius: 20px; padding: 12px;
      display: inline-flex; position: relative; z-index: 1;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.18);
      animation: floatLogo 4s ease-in-out infinite;
    }
    .logo-img {
      width: 64px; height: 64px; object-fit: contain; border-radius: 10px;
      filter: invert(1) hue-rotate(180deg) drop-shadow(0 0 10px rgba(59, 158, 255, 0.45));
      mix-blend-mode: screen;
    }
    @keyframes floatLogo { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes pulseGlow { 0% { opacity: 0.35; transform: scale(0.88); } 100% { opacity: 0.85; transform: scale(1.12); } }

    .login-box h2 { font-size: 1.25rem; color: var(--cyan); letter-spacing: 0.05em; margin-bottom: 4px; }
    .login-box .sub { font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); margin-bottom: 22px; }
    .form-group { text-align: left; margin-bottom: 14px; }
    .form-group label {
      display: block; font-size: 11px; color: rgba(103, 232, 249, 0.7);
      margin-bottom: 5px; font-family: var(--font-mono);
    }
    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 42px; }
    .toggle-pass {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px;
    }
    .toggle-pass:hover { color: var(--cyan); }
    .error-msg {
      background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5; padding: 10px; border-radius: 8px; font-size: 12px;
      margin-bottom: 12px; display: none; font-family: var(--font-mono);
    }

    /* ADMIN */
    #adminScreen { display: none; }
    .topbar {
      background: rgba(7, 10, 18, 0.9); border-bottom: 1px solid rgba(59, 158, 255, 0.2);
      padding: 12px 20px; display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 20; backdrop-filter: blur(16px);
    }
    .topbar h1 {
      font-size: 1.05rem; font-weight: 700; display: flex; align-items: center; gap: 8px;
      color: transparent; background: linear-gradient(to right, #22d3ee, #e0f2fe);
      -webkit-background-clip: text; background-clip: text;
    }
    .topbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-sm {
      background: rgba(8, 47, 73, 0.5); border: 1px solid rgba(0, 120, 224, 0.3);
      color: #7dd3fc; padding: 7px 12px; border-radius: 10px; font-size: 12px;
      font-weight: 600; cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center; gap: 5px; transition: all 0.2s;
      font-family: var(--font-mono);
    }
    .btn-sm:hover { background: rgba(14, 116, 144, 0.5); border-color: #0078e0; }
    .btn-danger {
      background: rgba(136, 19, 55, 0.4); border-color: rgba(244, 63, 94, 0.35); color: #fda4af;
    }
    .btn-danger:hover { background: rgba(159, 18, 57, 0.5); }

    .container { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
    .section-title {
      font-size: 12px; font-weight: 700; margin-bottom: 12px; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--cyan); font-family: var(--font-mono);
      display: flex; align-items: center; gap: 8px;
    }
    .section-title .dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--cyan);
      animation: pulseDot 1.5s ease-in-out infinite;
    }
    @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .add-form { padding: 18px; border-radius: 16px; margin-bottom: 24px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .form-row.full { grid-template-columns: 1fr; }
    @media (max-width: 640px) { .form-row { grid-template-columns: 1fr; } }

    /* Desktop table */
    .table-desktop { display: block; }
    .table-wrap {
      border-radius: 16px; overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      text-align: left; padding: 12px 14px; background: rgba(0, 0, 0, 0.25);
      border-bottom: 1px solid rgba(59, 158, 255, 0.15); color: rgba(103, 232, 249, 0.7);
      font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
      font-family: var(--font-mono); white-space: nowrap;
    }
    td {
      padding: 11px 14px; border-bottom: 1px solid rgba(59, 158, 255, 0.08); vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(59, 158, 255, 0.04); }
    .url-cell {
      max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);
    }
    .cat-badge {
      display: inline-block; padding: 3px 8px; border-radius: 6px;
      font-size: 10px; font-weight: 600; font-family: var(--font-mono);
    }
    .cat-module { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }
    .cat-tool { background: rgba(59, 158, 255, 0.1); color: var(--cyan); border: 1px solid rgba(59, 158, 255, 0.25); }
    .action-btns { display: flex; gap: 6px; }
    .btn-icon {
      background: rgba(8, 47, 73, 0.4); border: 1px solid rgba(0, 120, 224, 0.25);
      color: #7dd3fc; width: 30px; height: 30px; border-radius: 8px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 12px; transition: all 0.15s;
    }
    .btn-icon:hover { background: rgba(14, 116, 144, 0.5); border-color: #0078e0; }
    .btn-icon.delete {
      background: rgba(136, 19, 55, 0.3); border-color: rgba(244, 63, 94, 0.3); color: #fda4af;
    }
    .btn-icon.delete:hover { background: rgba(159, 18, 57, 0.45); }

    /* Mobile cards */
    .cards-mobile { display: none; }
    .file-card {
      padding: 14px; border-radius: 14px; margin-bottom: 10px;
    }
    .file-card-top {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px;
    }
    .file-card-title { font-weight: 700; font-size: 14px; word-break: break-word; }
    .file-card-meta {
      font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); margin-top: 4px;
    }
    .file-card-url {
      font-size: 11px; color: var(--text-muted); font-family: var(--font-mono);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin: 8px 0;
    }
    .file-card-actions { display: flex; gap: 8px; justify-content: flex-end; }

    @media (max-width: 768px) {
      .table-desktop { display: none; }
      .cards-mobile { display: block; }
    }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none;
      align-items: center; justify-content: center; z-index: 50; padding: 16px;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto;
      padding: 22px; border-radius: 18px;
    }
    .modal h3 { margin-bottom: 16px; font-size: 1.05rem; color: var(--cyan); }
    .modal-actions { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }
    .btn-secondary {
      background: transparent; border: 1px solid rgba(59, 158, 255, 0.25); color: var(--text-muted);
      padding: 9px 16px; border-radius: 10px; font-size: 13px; cursor: pointer; font-family: var(--font-main);
    }
    .btn-secondary:hover { border-color: var(--cyan); color: #fff; }
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: #0f172a; border: 1px solid var(--border-cyan); color: var(--cyan);
      padding: 12px 20px; border-radius: 12px; font-size: 13px; font-weight: 600;
      z-index: 100; transition: transform 0.3s ease; pointer-events: none; font-family: var(--font-mono);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div id="loginScreen">
    <div class="login-box neo-card">
      <div class="hero-logo-wrapper">
        <div class="logo-card">
          <img src="logo.png" alt="NEOSHY" class="logo-img" onerror="this.style.display='none'">
        </div>
      </div>
      <h2>VAULT ADMIN</h2>
      <p class="sub">Enter credentials to continue</p>
      <div class="error-msg" id="loginError"></div>
      <form id="loginForm">
        <div class="form-group">
          <label>Username / Email</label>
          <input type="text" id="loginUser" class="neo-input" required autocomplete="username">
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="password-wrap">
            <input type="password" id="loginPass" class="neo-input" required autocomplete="current-password">
            <button type="button" class="toggle-pass" onclick="togglePass('loginPass', this)">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="neo-btn" style="width:100%;margin-top:8px" id="loginBtn">Login System</button>
      </form>
    </div>
  </div>

  <div id="adminScreen">
    <div class="topbar">
      <h1><i class="fa-solid fa-box-archive" style="color:var(--cyan)"></i> Vault Admin</h1>
      <div class="topbar-actions">
        <a href="../manage/account.html" class="btn-sm"><i class="fa-solid fa-arrow-left"></i> Account</a>
        <button class="btn-sm btn-danger" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
      </div>
    </div>

    <div class="container">
      <div class="section-title"><span class="dot"></span> Add New File</div>
      <div class="add-form neo-card">
        <div class="form-row">
          <div class="form-group">
            <label>Category</label>
            <select id="newCategory" class="neo-input" onchange="onCategoryChange()">
              <option value="module">Module</option>
              <option value="tool">Tool</option>
            </select>
          </div>
          <div class="form-group">
            <label>Group Name</label>
            <input type="text" id="newGroup" class="neo-input" placeholder="Auto for Module" disabled>
          </div>
        </div>
        <div class="form-row full">
          <div class="form-group">
            <label>File Title</label>
            <input type="text" id="newTitle" class="neo-input" placeholder="filename.zip" required>
          </div>
        </div>
        <div class="form-row full">
          <div class="form-group">
            <label>Download URL</label>
            <input type="url" id="newUrl" class="neo-input" placeholder="https://..." required>
          </div>
        </div>
        <button class="neo-btn" onclick="addFile()"><i class="fa-solid fa-plus"></i> Add File</button>
      </div>

      <div class="section-title" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px">
        <span><span class="dot"></span> All Files (<span id="fileCount">0</span>)</span>
        <input type="search" id="adminSearch" class="neo-input" placeholder="Cari title / group / url..." style="max-width:280px;width:100%;padding:8px 12px;font-size:12px;font-family:var(--font-mono)" oninput="filterAdminFiles()">
      </div>

      <!-- Desktop table -->
      <div class="table-desktop">
        <div class="table-wrap neo-card">
          <table>
            <thead>
              <tr>
                <th>Title</th>
                <th>Category</th>
                <th>Group</th>
                <th>URL</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="fileTable"></tbody>
          </table>
        </div>
      </div>

      <!-- Mobile cards -->
      <div class="cards-mobile" id="fileCards"></div>
    </div>
  </div>

  <div class="modal-overlay" id="editModal">
    <div class="modal neo-card">
      <h3>Edit File</h3>
      <input type="hidden" id="editId">
      <div class="form-group">
        <label>Category</label>
        <select id="editCategory" class="neo-input" onchange="onEditCategoryChange()">
          <option value="module">Module</option>
          <option value="tool">Tool</option>
        </select>
      </div>
      <div class="form-group">
        <label>Group Name</label>
        <input type="text" id="editGroup" class="neo-input">
      </div>
      <div class="form-group">
        <label>Title</label>
        <input type="text" id="editTitle" class="neo-input">
      </div>
      <div class="form-group">
        <label>Download URL</label>
        <input type="url" id="editUrl" class="neo-input">
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeEdit()">Cancel</button>
        <button class="neo-btn" onclick="saveEdit()">Save</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const SUPABASE_URL = "https://vsednhqbszdiwpazcoii.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZzZWRuaHFic3pkaXdwYXpjb2lpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMjEyMDYsImV4cCI6MjEwMjY5NzIwNn0.SO5nMDZOqsT_Cwp9x4_9CFHPsVPpyNgndb2k_qVn89o";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let files = [];

    function onCategoryChange() {
      const cat = document.getElementById("newCategory").value;
      const groupInput = document.getElementById("newGroup");
      if (cat === "module") {
        groupInput.value = "Modules";
        groupInput.disabled = true;
      } else {
        groupInput.disabled = false;
        groupInput.value = "";
        groupInput.placeholder = "e.g. ADB & Developer Utilities";
      }
    }
    function onEditCategoryChange() {
      const cat = document.getElementById("editCategory").value;
      const groupInput = document.getElementById("editGroup");
      if (cat === "module") {
        groupInput.value = "Modules";
        groupInput.disabled = true;
      } else {
        groupInput.disabled = false;
      }
    }
    onCategoryChange();

    async function checkSession() {
      const { data: { session } } = await db.auth.getSession();
      if (session) { showAdmin(); loadFiles(); }
    }

    async function resolveEmail(input) {
      const val = input.trim();
      if (val.includes("@")) return val;
      try {
        const { data } = await db.from("login_aliases").select("email").eq("username", val).maybeSingle();
        if (data?.email) return data.email;
      } catch (e) {}
      if (val.toLowerCase() === "admin") return "moontrayl@gmail.com";
      return val;
    }

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errEl = document.getElementById("loginError");
      const btn = document.getElementById("loginBtn");
      errEl.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Logging in...";
      try {
        const email = await resolveEmail(document.getElementById("loginUser").value);
        const password = document.getElementById("loginPass").value;
        const { error } = await db.auth.signInWithPassword({ email, password });
        if (error) {
          errEl.textContent = "Invalid username or password!";
          errEl.style.display = "block";
          return;
        }
        showAdmin(); loadFiles();
      } catch (err) {
        errEl.textContent = err.message || "Login failed";
        errEl.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Login System";
      }
    });

    function showAdmin() {
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("adminScreen").style.display = "block";
    }
    async function logout() { await db.auth.signOut(); location.reload(); }

    function togglePass(id, btn) {
      const input = document.getElementById(id);
      const icon = btn.querySelector("i");
      if (input.type === "password") { input.type = "text"; icon.className = "fa-solid fa-eye-slash"; }
      else { input.type = "password"; icon.className = "fa-solid fa-eye"; }
    }

    function filterAdminFiles() {
      const q = ((document.getElementById("adminSearch") || {}).value || "").toLowerCase().trim();
      const src = files || [];
      const filtered = !q ? src.slice() : src.filter(function(f) {
        const hay = [f.title, f.category, f.group_name || f.group, f.url, f.meta].join(" ").toLowerCase();
        return hay.indexOf(q) !== -1;
      });
      renderTable(filtered);
      renderCards(filtered);
      const countEl = document.getElementById("fileCount");
      if (countEl) countEl.textContent = q ? (filtered.length + " / " + src.length) : String(src.length);
    }

    async function loadFiles() {
      const { data, error } = await db.from("vault_files").select("*").order("sort_order", { ascending: true });
      if (error) { showToast("Error: " + error.message); return; }
      files = (data || []).filter(f => {
        const t = (f.title || "").toLowerCase();
        return !t.includes("neoshy remote") && !t.includes("remote tool");
      });
      filterAdminFiles();
    }

    function esc(str) {
      if (!str) return "";
      return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    function renderTable(list) {
      const data = list || files;
      const tbody = document.getElementById("fileTable");
      if (!data.length) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:30px;color:var(--text-muted);font-family:var(--font-mono);font-size:12px">No files yet</td></tr>';
        return;
      }
      tbody.innerHTML = data.map(f =>
        '<tr><td><strong style="font-size:13px">' + esc(f.title) + '</strong></td>' +
        '<td><span class="cat-badge cat-' + f.category + '">' + f.category + '</span></td>' +
        '<td style="font-size:12px;color:var(--text-muted)">' + esc(f.group_name || "") + '</td>' +
        '<td class="url-cell" title="' + esc(f.url) + '">' + esc(f.url) + '</td>' +
        '<td><div class="action-btns">' +
        '<button class="btn-icon" title="Edit" onclick="openEdit(' + f.id + ')"><i class="fa-solid fa-pen"></i></button>' +
        '<button class="btn-icon delete" title="Delete" onclick="deleteFile(' + f.id + ')"><i class="fa-solid fa-trash"></i></button>' +
        '</div></td></tr>'
      ).join("");
    }

    function renderCards(list) {
      const data = list || files;
      const el = document.getElementById("fileCards");
      if (!data.length) {
        el.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-muted);font-family:var(--font-mono);font-size:12px">No files yet</div>';
        return;
      }
      el.innerHTML = data.map(f =>
        '<div class="file-card neo-card">' +
        '<div class="file-card-top">' +
        '<div><div class="file-card-title">' + esc(f.title) + '</div>' +
        '<div class="file-card-meta"><span class="cat-badge cat-' + f.category + '">' + f.category + '</span> ' + esc(f.group_name || "") + '</div></div>' +
        '</div>' +
        '<div class="file-card-url">' + esc(f.url) + '</div>' +
        '<div class="file-card-actions">' +
        '<button class="btn-icon" onclick="openEdit(' + f.id + ')"><i class="fa-solid fa-pen"></i></button>' +
        '<button class="btn-icon delete" onclick="deleteFile(' + f.id + ')"><i class="fa-solid fa-trash"></i></button>' +
        '</div></div>'
      ).join("");
    }

    async function addFile() {
      const category = document.getElementById("newCategory").value;
      let group_name = document.getElementById("newGroup").value.trim();
      const title = document.getElementById("newTitle").value.trim();
      const url = document.getElementById("newUrl").value.trim();
      if (category === "module") group_name = "Modules";
      if (!title || !url) { showToast("Please fill title and URL"); return; }
      if (category === "tool" && !group_name) { showToast("Please fill group name for Tool"); return; }
      const maxOrder = files.reduce((m, f) => Math.max(m, f.sort_order || 0), 0);
      const { error } = await db.from("vault_files").insert({ category, group_name, title, url, sort_order: maxOrder + 1 });
      if (error) { showToast("Error: " + error.message); return; }
      document.getElementById("newTitle").value = "";
      document.getElementById("newUrl").value = "";
      if (category === "tool") document.getElementById("newGroup").value = "";
      showToast("File added");
      loadFiles();
    }

    function openEdit(id) {
      const f = files.find(x => x.id === id);
      if (!f) return;
      document.getElementById("editId").value = f.id;
      document.getElementById("editCategory").value = f.category;
      document.getElementById("editGroup").value = f.group_name || "";
      document.getElementById("editTitle").value = f.title;
      document.getElementById("editUrl").value = f.url;
      onEditCategoryChange();
      document.getElementById("editModal").classList.add("show");
    }
    function closeEdit() { document.getElementById("editModal").classList.remove("show"); }

    async function saveEdit() {
      const id = document.getElementById("editId").value;
      const category = document.getElementById("editCategory").value;
      let group_name = document.getElementById("editGroup").value.trim();
      if (category === "module") group_name = "Modules";
      const payload = {
        category, group_name,
        title: document.getElementById("editTitle").value.trim(),
        url: document.getElementById("editUrl").value.trim(),
        updated_at: new Date().toISOString()
      };
      const { error } = await db.from("vault_files").update(payload).eq("id", id);
      if (error) { showToast("Error: " + error.message); return; }
      closeEdit(); showToast("Saved"); loadFiles();
    }

    async function deleteFile(id) {
      if (!confirm("Delete this file?")) return;
      const { error } = await db.from("vault_files").delete().eq("id", id);
      if (error) { showToast("Error: " + error.message); return; }
      showToast("Deleted"); loadFiles();
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2500);
    }

    checkSession();
  </script>
</body>
</html>

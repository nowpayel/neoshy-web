<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEOSHY Vault — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>

    /* Sembunyikan semua scrollbar (tetap bisa scroll) */
    html, body, * {
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }
    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    *::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
      background: transparent !important;
    }

    /* ── Micro-interactions (hover only, no continuous animation) ── */
    a, button, .btn, .btn-primary, .btn-ghost, .tab-btn, .dl-btn, .dl-link,
    .service-card, .feature-card, .shot-card, .file-item, .rom-folder, .rom-file,
    .account-btn, .tool-bridge a, .social-link, .chip-btn, .nav-links a {
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease, color 0.2s ease !important;
    }
    .btn-primary:hover, .btn.btn-primary:hover,
    a.btn-primary:hover, button.btn-primary:hover {
      transform: translateY(-2px) !important;
      box-shadow: 0 8px 28px rgba(59, 158, 255, 0.35) !important;
    }
    .btn-ghost:hover, a.btn-ghost:hover, button.btn-ghost:hover {
      transform: translateY(-1px) !important;
      border-color: rgba(59, 158, 255, 0.55) !important;
    }
    .service-card:hover, .feature-card:hover, .shot-card:hover,
    .rom-folder:hover, .file-item:hover, .rom-file:hover {
      transform: translateY(-3px) !important;
      border-color: rgba(59, 158, 255, 0.4) !important;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(59, 158, 255, 0.12) !important;
    }
    .tab-btn:hover, .dl-btn:hover, .dl-link:hover {
      transform: translateY(-1px) !important;
      box-shadow: 0 4px 16px rgba(59, 158, 255, 0.2) !important;
    }
    .nav-links a:hover {
      color: #3b9eff !important;
    }
    /* Hormati preferensi user yang tidak suka motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }


    :root {
      --bg: #0a0e17;
      --panel: rgba(16, 22, 36, 0.55);
      --border-cyan: rgba(59, 158, 255, 0.28);
      --cyan: #3b9eff;
      --blue: #0078e0;
      --red: #f87171;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --font-main: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    *::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }

    body {
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 50% 0%, rgba(59, 158, 255, 0.15) 0%, transparent 65%),
        radial-gradient(circle at 80% 50%, rgba(0, 120, 224, 0.08) 0%, transparent 50%);
      color: var(--text); font-family: var(--font-main); min-height: 100vh;
    }

    .neo-card {
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.02));
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.15);
    }
    .neo-input {
      background: rgba(10, 14, 23, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
      color: #fff; border-radius: 12px; padding: 11px 14px; width: 100%;
      font-size: 14px; outline: none; font-family: var(--font-main);
      backdrop-filter: blur(8px);
    }
    .neo-input:focus {
      border-color: rgba(59, 158, 255, 0.45);
      box-shadow: 0 0 12px rgba(59, 158, 255, 0.2);
    }
    .neo-input:disabled { opacity: 0.5; cursor: not-allowed; }
    .neo-btn {
      background: linear-gradient(135deg, rgba(59, 158, 255, 0.85), rgba(0, 120, 224, 0.75));
      box-shadow: 0 4px 20px rgba(0, 120, 224, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.25);
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.2); color: #0a0e17; font-weight: 700; padding: 11px 18px;
      border-radius: 12px; font-size: 14px; cursor: pointer; font-family: var(--font-main);
    }
    .neo-btn:hover { box-shadow: 0 6px 28px rgba(0, 120, 224, 0.35); transform: translateY(-1px); }
    .neo-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* LOGIN */
    #loginScreen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .login-box { width: 100%; max-width: 400px; padding: 32px 28px; border-radius: 20px; text-align: center; }
    .hero-logo-wrapper {
      position: relative; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px;
    }
    .hero-logo-wrapper::before {
      content: ''; position: absolute; width: 120px; height: 120px;
      background: radial-gradient(circle, rgba(59, 158, 255, 0.3) 0%, rgba(0, 120, 224, 0.1) 50%, transparent 70%);
      filter: blur(28px); z-index: 0; /* pulseGlow off */
    }
    .logo-card {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px) saturate(1.5); -webkit-backdrop-filter: blur(20px) saturate(1.5);
      border-radius: 20px; padding: 12px;
      display: inline-flex; position: relative; z-index: 1;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.18);
      /* floatLogo off */
    }
    .logo-img {
      width: 64px; height: 64px; object-fit: contain; border-radius: 10px;
      filter: invert(1) hue-rotate(180deg) drop-shadow(0 0 10px rgba(59, 158, 255, 0.45));
      mix-blend-mode: screen;
    }
    @keyframes floatLogo { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes pulseGlow { 0% { opacity: 0.35; transform: scale(0.88); } 100% { opacity: 0.85; transform: scale(1.12); } }

    .login-box h2 { font-size: 1.25rem; color: var(--cyan); letter-spacing: 0.05em; margin-bottom: 4px; }
    .login-box .sub { font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); margin-bottom: 22px; }
    .form-group { text-align: left; margin-bottom: 14px; }
    .form-group label {
      display: block; font-size: 11px; color: rgba(103, 232, 249, 0.7);
      margin-bottom: 5px; font-family: var(--font-mono);
    }
    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 42px; }
    .toggle-pass {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px;
    }
    .toggle-pass:hover { color: var(--cyan); }
    .error-msg {
      background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5; padding: 10px; border-radius: 8px; font-size: 12px;
      margin-bottom: 12px; display: none; font-family: var(--font-mono);
    }

    /* ADMIN */
    #adminScreen { display: none; }
    .topbar {
      background: rgba(7, 10, 18, 0.9); border-bottom: 1px solid rgba(59, 158, 255, 0.2);
      padding: 12px 20px; display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 20; backdrop-filter: blur(16px);
    }
    .topbar h1 {
      font-size: 1.05rem; font-weight: 700; display: flex; align-items: center; gap: 8px;
      color: transparent; background: linear-gradient(to right, #22d3ee, #e0f2fe);
      -webkit-background-clip: text; background-clip: text;
    }
    .topbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-sm {
      background: rgba(8, 47, 73, 0.5); border: 1px solid rgba(0, 120, 224, 0.3);
      color: #7dd3fc; padding: 7px 12px; border-radius: 10px; font-size: 12px;
      font-weight: 600; cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center; gap: 5px; transition: all 0.2s;
      font-family: var(--font-mono);
    }
    .btn-sm:hover { background: rgba(14, 116, 144, 0.5); border-color: #0078e0; }
    .btn-danger {
      background: rgba(136, 19, 55, 0.4); border-color: rgba(244, 63, 94, 0.35); color: #fda4af;
    }
    .btn-danger:hover { background: rgba(159, 18, 57, 0.5); }

    .container { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
    .section-title {
      font-size: 12px; font-weight: 700; margin-bottom: 12px; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--cyan); font-family: var(--font-mono);
      display: flex; align-items: center; gap: 8px;
    }
    .section-title .dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--cyan);
      animation: pulseDot 1.5s ease-in-out infinite;
    }
    @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .add-form { padding: 18px; border-radius: 16px; margin-bottom: 24px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .form-row.full { grid-template-columns: 1fr; }
    @media (max-width: 640px) { .form-row { grid-template-columns: 1fr; } }

    /* Desktop table */
    .table-desktop { display: block; }
    .table-wrap {
      border-radius: 16px; overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      text-align: left; padding: 12px 14px; background: rgba(0, 0, 0, 0.25);
      border-bottom: 1px solid rgba(59, 158, 255, 0.15); color: rgba(103, 232, 249, 0.7);
      font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
      font-family: var(--font-mono); white-space: nowrap;
    }
    td {
      padding: 11px 14px; border-bottom: 1px solid rgba(59, 158, 255, 0.08); vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(59, 158, 255, 0.04); }
    .url-cell {
      max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);
    }
    .cat-badge {
      display: inline-block; padding: 3px 8px; border-radius: 6px;
      font-size: 10px; font-weight: 600; font-family: var(--font-mono);
    }
    .cat-module { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }
    .cat-tool { background: rgba(59, 158, 255, 0.1); color: var(--cyan); border: 1px solid rgba(59, 158, 255, 0.25); }
    .cat-rom { background: rgba(245, 197, 66, 0.12); color: #f5c542; border: 1px solid rgba(245, 197, 66, 0.35); }

    .admin-tabs {
      display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 18px;
      background: rgba(255,255,255,0.04); padding: 5px; border-radius: 12px;
      border: 1px solid var(--border);
    }
    .admin-tab {
      background: transparent; border: none; color: var(--text-muted);
      padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: var(--font-main); transition: 0.2s;
    }
    .admin-tab.active, .admin-tab:hover {
      background: rgba(59, 158, 255, 0.15); color: var(--cyan);
    }
    .flat-file-list { display: flex; flex-direction: column; gap: 8px; }
    .flat-file-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border);
      background: rgba(255,255,255,0.03); flex-wrap: wrap;
    }
    .flat-file-row .ftitle { font-size: 13.5px; font-weight: 600; color: #fff; word-break: break-word; }
    .flat-file-row .furl {
      font-size: 11px; color: var(--text-muted); font-family: var(--font-mono);
      max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .rom-brand-block {
      margin-bottom: 18px; border: 1px solid rgba(59, 158, 255, 0.25);
      border-radius: 14px; overflow: hidden; background: rgba(0, 120, 224, 0.06);
    }
    .rom-brand-head {
      padding: 12px 16px; font-weight: 700; font-size: 14px; color: var(--cyan);
      background: rgba(59, 158, 255, 0.1); border-bottom: 1px solid rgba(59, 158, 255, 0.2);
      display: flex; align-items: center; gap: 8px;
    }
    .rom-device-block { padding: 10px 14px 14px; border-bottom: 1px solid var(--border); }
    .rom-device-block:last-child { border-bottom: none; }
    .rom-device-name {
      font-size: 13px; font-weight: 700; color: #fff; margin-bottom: 8px;
      display: flex; align-items: center; gap: 6px;
    }
    .rom-type-label {
      font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;
      letter-spacing: 0.5px; margin: 10px 0 6px; font-family: var(--font-mono);
    }
    .btn-kelola {
      background: rgba(59, 158, 255, 0.12); border: 1px solid rgba(59, 158, 255, 0.35);
      color: var(--cyan); padding: 4px 10px; border-radius: 8px; font-size: 11px;
      font-weight: 600; cursor: pointer; font-family: var(--font-main);
    }
    .btn-kelola:hover { background: rgba(59, 158, 255, 0.22); }
    .modal-wide { max-width: 720px !important; width: 100%; }
    .folder-cols {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px;
    }
    @media (max-width: 640px) { .folder-cols { grid-template-columns: 1fr; } }
    .folder-col {
      border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
      background: rgba(0,0,0,0.2); min-height: 120px;
    }
    .folder-col-head {
      padding: 10px 12px; font-size: 12px; font-weight: 700; color: var(--cyan);
      background: rgba(59, 158, 255, 0.1); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 6px;
    }
    .folder-col-head span { margin-left: auto; color: var(--text-muted); font-weight: 500; font-family: var(--font-mono); }
    .folder-col-list { padding: 8px; max-height: 220px; overflow-y: auto; }
    .folder-item {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 8px 10px; border-radius: 8px; margin-bottom: 4px;
      background: rgba(255,255,255,0.03); border: 1px solid transparent;
    }
    .folder-item:hover { border-color: rgba(59, 158, 255, 0.25); }
    .folder-item .fn { font-size: 12px; font-weight: 600; color: #fff; word-break: break-word; flex: 1; min-width: 0; }
    .folder-empty { font-size: 12px; color: var(--text-muted); padding: 16px 8px; text-align: center; }
    .folder-quick-add {
      padding: 14px; border-radius: 12px; border: 1px dashed rgba(59, 158, 255, 0.35);
      background: rgba(59, 158, 255, 0.05); margin-bottom: 8px;
    }
    .folder-preview {
      margin: 10px 0 4px; padding: 10px 12px; border-radius: 10px;
      border: 1px solid rgba(59, 158, 255, 0.25); background: rgba(0,0,0,0.25);
      font-size: 12px; max-height: 180px; overflow-y: auto;
    }
    .folder-preview .fp-title { font-weight: 700; color: var(--cyan); margin-bottom: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; }
    .folder-preview .fp-item { color: var(--text-muted); padding: 2px 0; word-break: break-word; }
    .folder-preview .fp-item.current { color: #f5c542; }

    .rom-admin-bc {
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
      margin-bottom: 14px; padding: 10px 12px; border-radius: 10px;
      background: rgba(0,0,0,0.25); border: 1px solid var(--border);
      font-size: 13px; font-family: var(--font-mono);
    }
    .rom-admin-bc .bc-link {
      background: none; border: none; color: var(--cyan); cursor: pointer;
      font-family: inherit; font-size: inherit; padding: 2px 4px; border-radius: 4px;
    }
    .rom-admin-bc .bc-link:hover { background: rgba(59,158,255,0.15); }
    .rom-admin-bc .bc-sep { opacity: 0.4; }
    .rom-admin-bc .bc-current { color: #fff; font-weight: 600; }
    .rom-hint { font-size: 13px; color: var(--text-muted); margin-bottom: 14px; line-height: 1.4; }
    .rom-admin-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px; margin-bottom: 18px;
    }
    .rom-admin-folder {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 14px 10px 10px; border-radius: 12px; text-align: center;
      background: rgba(59, 158, 255, 0.06); border: 1px solid rgba(59, 158, 255, 0.2);
      color: var(--text); font-family: var(--font-main); transition: 0.2s;
      position: relative;
    }
    .rom-admin-folder:hover {
      background: rgba(59, 158, 255, 0.14); border-color: rgba(59, 158, 255, 0.45);
    }
    .rom-admin-folder .raf-open {
      cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px;
      width: 100%; background: none; border: none; color: inherit; font-family: inherit; padding: 0;
    }
    .raf-name { font-size: 13px; font-weight: 700; word-break: break-word; }
    .raf-meta { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); }
    .raf-actions {
      display: flex; gap: 4px; margin-top: 4px; justify-content: center;
    }
    .raf-actions button {
      background: rgba(0,0,0,0.25); border: 1px solid var(--border); color: var(--text-muted);
      width: 28px; height: 28px; border-radius: 7px; cursor: pointer; font-size: 11px;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .raf-actions button:hover { color: var(--cyan); border-color: rgba(59,158,255,0.4); }
    .raf-actions button.danger:hover { color: #fb7185; border-color: rgba(251,113,133,0.4); }
    .rom-create-box {
      padding: 14px; border-radius: 12px; border: 1px dashed rgba(59, 158, 255, 0.4);
      background: rgba(59, 158, 255, 0.05);
    }
    .rom-context-banner {
      padding: 12px 14px; border-radius: 10px; margin-bottom: 14px;
      background: rgba(245, 197, 66, 0.1); border: 1px solid rgba(245, 197, 66, 0.35);
      color: #f5c542; font-size: 13px; font-weight: 600; line-height: 1.4;
    }
    .rom-context-banner b { color: #fff; }
    .rom-context-banner i { margin-right: 6px; }
    .drop-zone {
      border: 2px dashed rgba(59, 158, 255, 0.4);
      border-radius: 14px;
      padding: 28px 16px;
      text-align: center;
      background: rgba(59, 158, 255, 0.05);
      cursor: pointer;
      transition: 0.2s;
      color: var(--text);
      font-family: var(--font-main);
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--cyan);
      background: rgba(59, 158, 255, 0.12);
    }
    .drop-zone.drag-over {
      box-shadow: 0 0 0 3px rgba(59, 158, 255, 0.2);
    }
    .vault-upload-progress {
      margin-top: 12px; text-align: left; padding: 0 8px;
    }
    .vault-upload-progress .vup-text {
      font-size: 12px; color: var(--cyan); margin-bottom: 6px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .vault-upload-progress .vup-bar {
      height: 6px; background: rgba(255,255,255,0.08); border-radius: 99px; overflow: hidden;
    }
    .vault-upload-progress .vup-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #0078e0, #3b9eff, #67e8f9);
      background-size: 200% 100%;
      border-radius: 99px;
      transition: width 0.25s ease;
      animation: vupShine 1.2s linear infinite;
    }
    @keyframes vupShine {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }
    .action-btns { display: flex; gap: 6px; }
    .btn-icon {
      background: rgba(8, 47, 73, 0.4); border: 1px solid rgba(0, 120, 224, 0.25);
      color: #7dd3fc; width: 30px; height: 30px; border-radius: 8px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 12px; transition: all 0.15s;
    }
    .btn-icon:hover { background: rgba(14, 116, 144, 0.5); border-color: #0078e0; }
    .btn-icon.delete {
      background: rgba(136, 19, 55, 0.3); border-color: rgba(244, 63, 94, 0.3); color: #fda4af;
    }
    .btn-icon.delete:hover { background: rgba(159, 18, 57, 0.45); }

    /* Mobile cards */
    .cards-mobile { display: none; }
    .file-card {
      padding: 14px; border-radius: 14px; margin-bottom: 10px;
    }
    .file-card-top {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px;
    }
    .file-card-title { font-weight: 700; font-size: 14px; word-break: break-word; }
    .file-card-meta {
      font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); margin-top: 4px;
    }
    .file-card-url {
      font-size: 11px; color: var(--text-muted); font-family: var(--font-mono);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin: 8px 0;
    }

    const SUPABASE_URL = "https://vsednhqbszdiwpazcoii.supabase.co";

      try {

    }

    async function checkSession() {
      try {
        let access_token = null, refresh_token = null;
        if (window.location.hash && window.location.hash.indexOf("access_token") !== -1) {
          try {
            const hash = window.location.hash.substring(1);
            const m1 = hash.match(/access_token=([^&]+)/);
            const m2 = hash.match(/refresh_token=([^&]+)/);
            if (m1) access_token = decodeURIComponent(m1[1]);
            if (m2) refresh_token = decodeURIComponent(m2[1]);
          } catch (e) {}
          try { history.replaceState(null, "", window.location.href.split("#")[0]); } catch (e) {}
        }
        if (access_token) {
          let ok = false;
          if (refresh_token) {
            try {
              const { data, error } = await db.auth.setSession({ access_token, refresh_token });
              if (!error && data && data.session) ok = true;
            } catch (e) {}
          }
          if (!ok) {
            try {
              const payload = decodeJwtPayload(access_token) || {};
              const expiresAt = payload.exp || (Math.floor(Date.now() / 1000) + 3600);
              localStorage.setItem("sb-vsednhqbszdiwpazcoii-auth-token", JSON.stringify({
                access_token, refresh_token: refresh_token || "",
                expires_in: Math.max(0, expiresAt - Math.floor(Date.now() / 1000)),
                expires_at: expiresAt, token_type: "bearer",
                user: { id: payload.sub || "", email: payload.email || "", role: "authenticated" }
              }));
            } catch (e) {}
          }
          showAdmin(); await loadFiles();
          return;
        }
        const { data: { session } } = await db.auth.getSession();
        if (session) { showAdmin(); await loadFiles(); }
        else {
          try {
            const raw = localStorage.getItem("sb-vsednhqbszdiwpazcoii-auth-token");
            if (raw && JSON.parse(raw).access_token) { showAdmin(); await loadFiles(); }
          } catch (e) {}
        }
      } catch (e) {
        console.warn("session", e);
      } finally {
        if (window.hidePageLoader) hidePageLoader();
      }
    }

    async function resolveEmail(input) {
      const val = input.trim();
      if (val.includes("@")) return val;
      try {
        const { data } = await db.from("login_aliases").select("email").eq("username", val).maybeSingle();
        if (data?.email) return data.email;
      } catch (e) {}
      if (val.toLowerCase() === "admin") return "moontrayl@gmail.com";
      return val;

    function filterAdminFiles() {
      const q = ((document.getElementById("adminSearch") || {}).value || "").toLowerCase().trim();
      const src = (files || []).filter(f => f.category === adminFilter);
      const filtered = !q ? src.slice() : src.filter(function(f) {

      renderAdminList(filtered);

          const d = (tree[romAdminNav.brand] && tree[romAdminNav.brand][romAdminNav.device]) || { rom: [], recovery: [], addon: [] };
          const t = romAdminNav.type;
          countEl.textContent = String(t === "recovery" ? d.recovery.length : t === "addon" ? d.addon.length : d.rom.length);
        } else {
          countEl.textContent = String(filtered.length);
        }
      }
      refreshDeviceDatalist();
    }

    function refreshDeviceDatalist() {
      const dl = document.getElementById("device-list");
      if (!dl) return;
      const devices = new Set();
      (files || []).forEach(f => {
        if (f.category !== "rom") return;
        const p = parseRomGroup(f.group_name);
        if (p.device) devices.add(p.device);
      });
      dl.innerHTML = Array.from(devices).sort().map(d => '<option value="' + esc(d) + '">').join("");
    }

    async function loadFiles() {
      const { data, error } = await db.from("vault_files").select("*").order("sort_order", { ascending: true });
      if (error) { showToast("Error: " + error.message); return; }
      files = (data || []).filter(f => {
        const t = (f.title || "").toLowerCase();
        return !t.includes("neoshy remote") && !t.includes("remote tool");
      });
      filterAdminFiles();
    }

    function esc(str) {
      if (!str) return "";
      return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    function fileRowHTML(f, extraLabel) {

    // Folder virtual (kosong) disimpan di localStorage agar tetap muncul sebelum ada file
    function loadVirtualFolders() {
      try { return JSON.parse(localStorage.getItem("vault_rom_folders") || "[]"); } catch (e) { return []; }
    }
    function saveVirtualFolders(arr) {
      localStorage.setItem("vault_rom_folders", JSON.stringify(arr || []));
    }
    function addVirtualFolder(brand, device) {
      const arr = loadVirtualFolders();
      if (!arr.some(x => x.brand === brand && x.device === device)) {
        arr.push({ brand: brand, device: device });
        saveVirtualFolders(arr);
      }
    }
    function removeVirtualFolder(brand, device) {
      saveVirtualFolders(loadVirtualFolders().filter(x => !(x.brand === brand && (!device || x.device === device))));
    }
    function renameVirtualFolder(oldBrand, oldDevice, newBrand, newDevice) {
      const arr = loadVirtualFolders().map(x => {
        if (oldDevice) {
          if (x.brand === oldBrand && x.device === oldDevice) {
            return { brand: newBrand || x.brand, device: newDevice || x.device };
          }
        } else if (x.brand === oldBrand) {
          return { brand: newBrand || x.brand, device: x.device };
        }
        return x;
      });
      saveVirtualFolders(arr);
    }

    // Prompt rapi (ganti window.prompt)
    function neoPrompt(title, message, defaultVal) {
      return new Promise(function(resolve) {
        var overlay = document.getElementById("neoPromptOverlay");
        if (!overlay) {
          overlay = document.createElement("div");
          overlay.id = "neoPromptOverlay";
          overlay.className = "modal-overlay show";
          overlay.innerHTML = '<div class="modal neo-card" style="max-width:400px">' +
            '<h3 id="neoPromptTitle"></h3>' +
            '<p id="neoPromptMsg" style="font-size:13px;color:var(--text-muted);margin-bottom:12px"></p>' +
            '<input type="text" id="neoPromptInput" class="neo-input" style="width:100%;margin-bottom:14px">' +
            '<div class="modal-actions">' +
            '<button type="button" class="btn-secondary" id="neoPromptCancel">Batal</button>' +
            '<button type="button" class="neo-btn" id="neoPromptOk">OK</button>' +
            '</div></div>';
          document.body.appendChild(overlay);
        }
        overlay.classList.add("show");
        document.getElementById("neoPromptTitle").textContent = title || "Rename";
        document.getElementById("neoPromptMsg").textContent = message || "";
        var inp = document.getElementById("neoPromptInput");
        inp.value = defaultVal || "";
        setTimeout(function() { inp.focus(); inp.select(); }, 50);
        function done(val) {
          overlay.classList.remove("show");
          resolve(val);
        }
        document.getElementById("neoPromptOk").onclick = function() { done(inp.value); };
        document.getElementById("neoPromptCancel").onclick = function() { done(null); };
        inp.onkeydown = function(e) {
          if (e.key === "Enter") done(inp.value);
          if (e.key === "Escape") done(null);
        };
      });
    }

    function buildAdminRomTree(list) {
      const tree = {};
      (list || files || []).forEach(f => {
        if (f.category !== "rom") return;
        const p = parseRomGroup(f.group_name);
        if (!p || !p.brand) return;
        if (!tree[p.brand]) tree[p.brand] = {};
        if (!tree[p.brand][p.device]) tree[p.brand][p.device] = { rom: [], recovery: [], addon: [], note: null };
        if (p.type === "recovery_note") tree[p.brand][p.device].note = f;
        else if (p.type === "recovery") tree[p.brand][p.device].recovery.push(f);
        else if (p.type === "addon") tree[p.brand][p.device].addon.push(f);
        else tree[p.brand][p.device].rom.push(f);
      });
      // merge virtual empty folders
      loadVirtualFolders().forEach(v => {
        if (!v.brand || !v.device) return;
        if (!tree[v.brand]) tree[v.brand] = {};
        if (!tree[v.brand][v.device]) tree[v.brand][v.device] = { rom: [], recovery: [], addon: [], note: null };
      });
      return tree;
    }

    function bindDropZone() {
      const zone = document.getElementById("vaultDropZone");
      const input = document.getElementById("vaultFileInput");
      if (!zone || !input) return;

      zone.addEventListener("click", function(e) {
        if (e.target === input) return;
        input.click();
      });
      input.addEventListener("change", function() {
        if (input.files && input.files.length) handleVaultFiles(input.files);
        input.value = "";
      });
      zone.addEventListener("dragover", function(e) {
        e.preventDefault();
        e.stopPropagation();
        zone.classList.add("drag-over");
      });
      zone.addEventListener("dragleave", function(e) {
        e.preventDefault();
        zone.classList.remove("drag-over");
      });
      zone.addEventListener("drop", function(e) {
        e.preventDefault();
        e.stopPropagation();
        zone.classList.remove("drag-over");
        if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
          handleVaultFiles(e.dataTransfer.files);
        }
      });
    }

    function sanitizePathPart(s) {
      return String(s || "").replace(/[^a-zA-Z0-9._\-\s]/g, "").replace(/\s+/g, "_").slice(0, 80) || "x";
    }

    var VAULT_ADDON_MAX_BYTES = 25 * 1024 * 1024; // 25 MB

    async function handleVaultFiles(fileList) {
      if (!romAdminNav.brand || !romAdminNav.device || !romAdminNav.type) {
        showToast("Masuk ke folder dulu");
        return;
      }
      const filesArr = Array.from(fileList);
      if (!filesArr.length) return;

      // Batas 25 MB khusus folder Addon
      let toUpload = filesArr;
      if (romAdminNav.type === "addon") {
        const tooBig = filesArr.filter(f => f.size > VAULT_ADDON_MAX_BYTES);
        if (tooBig.length) {
          const names = tooBig.map(f => f.name + " (" + (f.size / 1024 / 1024).toFixed(1) + " MB)").join("\n");
          await neoConfirm({
            title: "File terlalu besar",
            message: "Folder Addon maksimal 25 MB per file.\n\nDitolak:\n" + names + "\n\nPakai direct link untuk file besar.",
            okText: "Oke"
          });
        }
        toUpload = filesArr.filter(f => f.size <= VAULT_ADDON_MAX_BYTES);
        if (!toUpload.length) return;
      }

      const prog = document.getElementById("vaultUploadProgress");
      const fill = document.getElementById("vaultAdminFill");
      const textEl = prog ? prog.querySelector(".vup-text") : null;
      if (prog) prog.style.display = "block";
      if (fill) fill.style.width = "0%";
      if (window.showPageLoader) showPageLoader("Upload file...");

      let ok = 0, fail = 0;
      for (let i = 0; i < toUpload.length; i++) {
        const file = toUpload[i];
        if (textEl) textEl.textContent = "Upload " + (i + 1) + " / " + toUpload.length + " — " + file.name;
        if (fill) fill.style.width = Math.round((i / toUpload.length) * 100) + "%";
        try {
          await uploadVaultFile(file);
          ok++;
        } catch (err) {
          fail++;
          console.error(err);
          showToast("Gagal: " + file.name + " — " + (err.message || err));
        }
        if (fill) fill.style.width = Math.round(((i + 1) / toUpload.length) * 100) + "%";
      }
      if (window.hidePageLoader) hidePageLoader();
      if (textEl) textEl.textContent = ok ? "Selesai — " + ok + " file" : "Gagal upload";
      setTimeout(function() { if (prog) prog.style.display = "none"; }, 800);
      if (ok) showToast(ok + " file berhasil diupload" + (fail ? " (" + fail + " gagal)" : ""));
      await loadFiles();
    }

    async function uploadVaultFile(file) {
      const brand = sanitizePathPart(romAdminNav.brand);
      const device = sanitizePathPart(romAdminNav.device);
      const type = romAdminNav.type;
      const safeName = file.name.replace(/[^a-zA-Z0-9._\-]/g, "_");
      const path = brand + "/" + device + "/" + type + "/" + Date.now() + "_" + safeName;

      const { error: upErr } = await db.storage.from("vault").upload(path, file, {
        cacheControl: "3600",
        upsert: false,
        contentType: file.type || "application/octet-stream"
      });
      if (upErr) throw upErr;

      const { data: urlData } = db.storage.from("vault").getPublicUrl(path);
      const publicUrl = urlData && urlData.publicUrl;
      if (!publicUrl) throw new Error("Gagal dapat public URL");

      const group_name = buildRomGroup(romAdminNav.brand, romAdminNav.device, romAdminNav.type);
      const maxOrder = files.reduce((m, f) => Math.max(m, f.sort_order || 0), 0);
      const { error: dbErr } = await db.from("vault_files").insert({
        category: "rom",
        group_name: group_name,
        title: file.name,
        url: publicUrl,
        sort_order: maxOrder + 1
      });
      if (dbErr) throw dbErr;
    }

    function jsEsc(s) {
      return String(s || "").replace(/\\/g, "\\\\").replace(/'/g, "\\'");
    }

    function createDeviceFolder(fixedBrand) {
      const brand = (fixedBrand || (document.getElementById("createBrand") || {}).value || "").trim();
      const device = ((document.getElementById("createDeviceOnly") || document.getElementById("createDevice") || {}).value || "").trim();
      if (!brand) { showToast("Isi nama Brand"); return; }
      if (!device) { showToast("Isi tipe HP / Device"); return; }
      addVirtualFolder(brand, device);
      romAdminGo(brand, device, null);
      showToast("Folder " + brand + " / " + device + " dibuat");
    }

    async function renameFolder(level, brand, device) {
      if (level === "brand") {
        const neu = await neoPrompt("Rename Brand", "Nama brand baru untuk \"" + brand + "\":", brand);
        if (neu == null) return;
        const newBrand = neu.trim();
        if (!newBrand || newBrand === brand) return;
        if (window.showPageLoader) showPageLoader("Rename brand...");
        try {
          const targets = (files || []).filter(f => {
            if (f.category !== "rom") return false;
            return parseRomGroup(f.group_name).brand === brand;
          });
          for (const f of targets) {
            const p = parseRomGroup(f.group_name);
            const newGroup = buildRomGroup(newBrand, p.device, p.type);
            const { error } = await db.from("vault_files").update({ group_name: newGroup }).eq("id", f.id);
            if (error) throw error;
          }
          renameVirtualFolder(brand, null, newBrand, null);
          if (romAdminNav.brand === brand) romAdminNav.brand = newBrand;
          showToast("Brand diganti: " + brand + " → " + newBrand);
          await loadFiles();
        } catch (e) {
          showToast("Gagal rename: " + (e.message || e));
        }
        if (window.hidePageLoader) hidePageLoader();
      } else if (level === "device") {
        const neu = await neoPrompt("Rename Tipe HP", "Nama tipe HP baru untuk \"" + device + "\":", device);
        if (neu == null) return;
        const newDevice = neu.trim();
        if (!newDevice || newDevice === device) return;
        if (window.showPageLoader) showPageLoader("Rename device...");
        try {
          const targets = (files || []).filter(f => {
            if (f.category !== "rom") return false;
            const p = parseRomGroup(f.group_name);
            return p.brand === brand && p.device === device;
          });
          for (const f of targets) {
            const p = parseRomGroup(f.group_name);
            const newGroup = buildRomGroup(brand, newDevice, p.type);
            const { error } = await db.from("vault_files").update({ group_name: newGroup }).eq("id", f.id);
            if (error) throw error;
          }
          renameVirtualFolder(brand, device, brand, newDevice);
          if (romAdminNav.device === device) romAdminNav.device = newDevice;
          showToast("Device diganti: " + device + " → " + newDevice);
          await loadFiles();
        } catch (e) {
          showToast("Gagal rename: " + (e.message || e));
        }
        if (window.hidePageLoader) hidePageLoader();
      }
    }

    async function deleteFolder(level, brand, device) {
      if (level === "brand") {
        const ok = await neoConfirm({
          title: "Hapus folder brand?",
          message: "Semua tipe HP dan file di dalam brand \"" + brand + "\" akan dihapus. Tidak bisa dibatalkan.",
          okText: "Hapus semua"
        });
        if (!ok) return;
        if (window.showPageLoader) showPageLoader("Menghapus...");
        try {
          const targets = (files || []).filter(f => {
            if (f.category !== "rom") return false;
            return parseRomGroup(f.group_name).brand === brand;
          });
          for (const f of targets) {
            const { error } = await db.from("vault_files").delete().eq("id", f.id);
            if (error) throw error;
          }
          removeVirtualFolder(brand, null);
          if (romAdminNav.brand === brand) romAdminNav = { brand: null, device: null, type: null };
          showToast("Brand \"" + brand + "\" dihapus");
          await loadFiles();
        } catch (e) {
          showToast("Gagal hapus: " + (e.message || e));
        }
        if (window.hidePageLoader) hidePageLoader();
      } else if (level === "device") {
        const ok = await neoConfirm({
          title: "Hapus folder tipe HP?",
          message: "Semua file ROM & Recovery di \"" + brand + " / " + device + "\" akan dihapus.",
          okText: "Hapus"
        });
        if (!ok) return;
        if (window.showPageLoader) showPageLoader("Menghapus...");
        try {
          const targets = (files || []).filter(f => {
            if (f.category !== "rom") return false;
            const p = parseRomGroup(f.group_name);
            return p.brand === brand && p.device === device;
          });
          for (const f of targets) {
            const { error } = await db.from("vault_files").delete().eq("id", f.id);
            if (error) throw error;
          }
          removeVirtualFolder(brand, device);
          if (romAdminNav.device === device) romAdminNav = { brand: brand, device: null, type: null };
          showToast("Folder \"" + device + "\" dihapus");
          await loadFiles();
        } catch (e) {
          showToast("Gagal hapus: " + (e.message || e));
        }
        if (window.hidePageLoader) hidePageLoader();
      }
    }

    async function addLinkHere() {
      if (!romAdminNav.brand || !romAdminNav.device || !romAdminNav.type) {
        showToast("Masuk ke folder ROM atau Recovery dulu");
        return;
      }
      const title = (document.getElementById("inlineAddTitle") || {}).value.trim();
      const url = (document.getElementById("inlineAddUrl") || {}).value.trim();
      if (!title || !url) { showToast("Isi nama file dan URL"); return; }
      if (window.showPageLoader) showPageLoader("Menambah...");
      const group_name = buildRomGroup(romAdminNav.brand, romAdminNav.device, romAdminNav.type);
      const maxOrder = files.reduce((m, f) => Math.max(m, f.sort_order || 0), 0);
      const { error } = await db.from("vault_files").insert({
        category: "rom", group_name, title, url, sort_order: maxOrder + 1
      });
      if (error) {
        if (window.hidePageLoader) hidePageLoader();
        showToast("Error: " + error.message);
        return;
      }
      showToast("Link ditambah ke " + romAdminNav.brand + " / " + romAdminNav.device + " / " + (romAdminNav.type === "recovery" ? "Recovery" : "ROM"));
      await loadFiles();
      if (window.hidePageLoader) hidePageLoader();
    }

    async function saveAdminRecoveryNote() {
      if (!romAdminNav.brand || !romAdminNav.device) {
        showToast("Masuk ke folder Recovery dulu");
        return;
      }
      const text = (document.getElementById("adminNoteText") || {}).value || "";
      const noteIdRaw = (document.getElementById("adminNoteId") || {}).value || "";
      const noteId = noteIdRaw ? Number(noteIdRaw) : null;
      const group_name = romAdminNav.brand + "|||" + romAdminNav.device + "|||recovery_note";
      if (window.showPageLoader) showPageLoader("Menyimpan note...");
      try {
        if (noteId) {
          const { error } = await db.from("vault_files").update({
            title: "Recovery Note",
            url: text,
            group_name: group_name,
            category: "rom",
            updated_at: new Date().toISOString()
          }).eq("id", noteId);
          if (error) throw error;
        } else {
          const maxOrder = files.reduce((m, f) => Math.max(m, f.sort_order || 0), 0);
          const { error } = await db.from("vault_files").insert({
            category: "rom",
            group_name: group_name,
            title: "Recovery Note",
            url: text,
            sort_order: maxOrder + 1
          });
          if (error) throw error;
        }
        showToast("Note recovery disimpan");
        await loadFiles();
      } catch (e) {
        showToast("Gagal simpan note: " + (e.message || e));
      }
      if (window.hidePageLoader) hidePageLoader();
    }

    function formatGroupLabel(f) {
      if (f.category === "rom") {
        const p = parseRomGroup(f.group_name);
        if (p.type === "recovery_note") return (p.brand || "?") + " / " + (p.device || "?") + " / Note";
        const t = p.type === "recovery" ? "Recovery" : p.type === "addon" ? "Addon" : "ROM";
        return (p.brand || "?") + " / " + (p.device || "?") + " / " + t;
      }
      return "";
    }

    window.neoConfirm = function(opts) {
      opts = opts || {};
      return new Promise(function(resolve) {
        var el = document.getElementById("neoConfirm");
        if (!el) { resolve(window.confirm(opts.message || "Yakin?")); return; }
        document.getElementById("neoConfirmTitle").textContent = opts.title || "Konfirmasi";
        document.getElementById("neoConfirmMsg").textContent = opts.message || "Yakin lanjut?";
        document.getElementById("neoConfirmOk").textContent = opts.okText || "Hapus";
        document.getElementById("neoConfirmCancel").textContent = opts.cancelText || "Batal";
        el.classList.add("show");
        function cleanup(val) {
          el.classList.remove("show");
          okBtn.onclick = null; cancelBtn.onclick = null; el.onclick = null;
          resolve(val);
        }
        var okBtn = document.getElementById("neoConfirmOk");
        var cancelBtn = document.getElementById("neoConfirmCancel");
        okBtn.onclick = function() { cleanup(true); };
        cancelBtn.onclick = function() { cleanup(false); };
        el.onclick = function(e) { if (e.target === el) cleanup(false); };
      });
    };

    async function addFile() {
      if (window.showPageLoader) showPageLoader("Menambah file...");
      const category = document.getElementById("newCategory").value;
      let group_name = "";
      const title = document.getElementById("newTitle").value.trim();
      const url = document.getElementById("newUrl").value.trim();
      // Module & Tool: flat, tanpa sub-kategori
      if (category === "module") group_name = "Modules";
      else if (category === "tool") group_name = "Tools";
      else if (category === "rom") {
        const brand = document.getElementById("newBrand").value.trim();
        const device = document.getElementById("newDevice").value.trim();
        const romType = document.getElementById("newRomType").value;
        if (!brand || !device) {
          if (window.hidePageLoader) hidePageLoader();
          showToast("Isi Brand dan Device untuk Rom & Recovery");
          return;
        }
        group_name = buildRomGroup(brand, device, romType);
      }
      if (!title || !url) { if (window.hidePageLoader) hidePageLoader(); showToast("Please fill title and URL"); return; }
      const maxOrder = files.reduce((m, f) => Math.max(m, f.sort_order || 0), 0);
      const { error } = await db.from("vault_files").insert({ category, group_name, title, url, sort_order: maxOrder + 1 });
      if (error) { if (window.hidePageLoader) hidePageLoader(); showToast("Error: " + error.message); return; }
      document.getElementById("newTitle").value = "";
      document.getElementById("newUrl").value = "";
      if (category === "tool") document.getElementById("newGroup").value = "";
      if (category === "rom") {
        // Keep brand/device for next file (same folder), clear only title/url
      }
      showToast("File added");
      await loadFiles();
      if (window.hidePageLoader) hidePageLoader();
    }

    function openEdit(id) {
      const f = files.find(x => x.id === id);
      if (!f) return;
      document.getElementById("editId").value = f.id;
      document.getElementById("editCategory").value = f.category;
      document.getElementById("editGroup").value = f.group_name || "";
      document.getElementById("editTitle").value = f.title;
      document.getElementById("editUrl").value = f.url;
      if (f.category === "rom") {
        const p = parseRomGroup(f.group_name);
        document.getElementById("editBrand").value = p.brand;
        document.getElementById("editDevice").value = p.device;
        document.getElementById("editRomType").value = (p.type === "recovery" || p.type === "recovery_note") ? "recovery" : (p.type === "addon" ? "addon" : "rom");
      }
      onEditCategoryChange();
      refreshEditFolderPreview();
      document.getElementById("editModal").classList.add("show");
    }
    function closeEdit() { document.getElementById("editModal").classList.remove("show"); }

    function getDeviceFiles(brand, device) {
      const rom = [], recovery = [];
      (files || []).forEach(f => {
        if (f.category !== "rom") return;
        const p = parseRomGroup(f.group_name);
        if (p.brand !== brand || p.device !== device) return;
        if (p.type === "recovery_note") return;
        if (p.type === "recovery") recovery.push(f);
        else rom.push(f);
      });
      return { rom, recovery };
    }

    function refreshEditFolderPreview() {
      const box = document.getElementById("editFolderPreview");
      if (!box) return;
      const brand = (document.getElementById("editBrand") || {}).value || "";
      const device = (document.getElementById("editDevice") || {}).value || "";
      const editId = document.getElementById("editId").value;
      if (!brand.trim() || !device.trim()) {
        box.innerHTML = '<div class="fp-title">Isi folder</div><div class="fp-item">Isi Brand & Device untuk melihat isi folder ROM / Recovery</div>';
        return;
      }
      const { rom, recovery } = getDeviceFiles(brand.trim(), device.trim());
      let html = '<div class="fp-title">Isi folder — ' + esc(brand) + ' / ' + esc(device) + '</div>';
      html += '<div style="margin-bottom:6px"><strong style="color:#3b9eff">ROM (' + rom.length + ')</strong></div>';
      if (!rom.length) html += '<div class="fp-item">— kosong</div>';
      else rom.forEach(f => {
        const cur = String(f.id) === String(editId) ? ' current' : '';
        html += '<div class="fp-item' + cur + '">• ' + esc(f.title) + (cur ? ' ← file ini' : '') + '</div>';
      });
      html += '<div style="margin:8px 0 6px"><strong style="color:#3b9eff">Recovery (' + recovery.length + ')</strong></div>';
      if (!recovery.length) html += '<div class="fp-item">— kosong</div>';
      else recovery.forEach(f => {
        const cur = String(f.id) === String(editId) ? ' current' : '';
        html += '<div class="fp-item' + cur + '">• ' + esc(f.title) + (cur ? ' ← file ini' : '') + '</div>';
      });
      box.innerHTML = html;
    }

    function openFolderModal(brand, device) {
      document.getElementById("folderBrand").value = brand;
      document.getElementById("folderDevice").value = device;
      document.getElementById("folderModalTitle").textContent = "Kelola Folder";
      document.getElementById("folderModalSub").textContent = brand + " / " + device;
      document.getElementById("folderAddTitle").value = "";
      document.getElementById("folderAddUrl").value = "";
      renderFolderModalLists();
      document.getElementById("folderModal").classList.add("show");
    }

    function closeFolderModal() {
      document.getElementById("folderModal").classList.remove("show");
    }

    function renderFolderModalLists() {
      const brand = document.getElementById("folderBrand").value;
      const device = document.getElementById("folderDevice").value;
      const { rom, recovery } = getDeviceFiles(brand, device);

      document.getElementById("folderRomCount").textContent = "(" + rom.length + ")";
      document.getElementById("folderRecCount").textContent = "(" + recovery.length + ")";

      const romList = document.getElementById("folderRomList");
      const recList = document.getElementById("folderRecList");

      romList.innerHTML = rom.length
        ? rom.map(f => folderItemHTML(f)).join("")
        : '<div class="folder-empty">Belum ada file ROM</div>';
      recList.innerHTML = recovery.length
        ? recovery.map(f => folderItemHTML(f)).join("")
        : '<div class="folder-empty">Belum ada file Recovery</div>';
    }

    function folderItemHTML(f) {
      return '<div class="folder-item">' +
        '<div class="fn" title="' + esc(f.url) + '">' + esc(f.title) + '</div>' +
        '<div class="action-btns">' +
        '<button class="btn-icon" title="Edit" onclick="closeFolderModal();openEdit(' + f.id + ')"><i class="fa-solid fa-pen"></i></button>' +
        '<button class="btn-icon delete" title="Delete" onclick="deleteFile(' + f.id + ')"><i class="fa-solid fa-trash"></i></button>' +
        '</div></div>';
    }

    async function addFileToFolder() {
      const brand = document.getElementById("folderBrand").value.trim();
      const device = document.getElementById("folderDevice").value.trim();
      const romType = document.getElementById("folderAddType").value;
      const title = document.getElementById("folderAddTitle").value.trim();
      const url = document.getElementById("folderAddUrl").value.trim();
      if (!brand || !device) { showToast("Brand/Device kosong"); return; }
      if (!title || !url) { showToast("Isi title dan URL"); return; }
      if (window.showPageLoader) showPageLoader("Menambah...");
      const group_name = buildRomGroup(brand, device, romType);
      const maxOrder = files.reduce((m, f) => Math.max(m, f.sort_order || 0), 0);
      const { error } = await db.from("vault_files").insert({
        category: "rom", group_name, title, url, sort_order: maxOrder + 1
      });
      if (error) {
        if (window.hidePageLoader) hidePageLoader();
        showToast("Error: " + error.message);
        return;
      }
      document.getElementById("folderAddTitle").value = "";
      document.getElementById("folderAddUrl").value = "";
      showToast("File ditambah ke " + (romType === "recovery" ? "Recovery" : "ROM"));
      await loadFiles();
      // Refresh folder modal lists (modal masih terbuka)
      renderFolderModalLists();
      if (window.hidePageLoader) hidePageLoader();
    }

    async function saveEdit() {
      if (window.showPageLoader) showPageLoader("Menyimpan...");
      const id = document.getElementById("editId").value;
      const category = document.getElementById("editCategory").value;
      let group_name = "";
      if (category === "module") group_name = "Modules";
      else if (category === "tool") group_name = "Tools";
      else if (category === "rom") {
        const brand = document.getElementById("editBrand").value.trim();
        const device = document.getElementById("editDevice").value.trim();
        const romType = document.getElementById("editRomType").value;
        if (!brand || !device) {
          if (window.hidePageLoader) hidePageLoader();
          showToast("Isi Brand dan Device");
          return;
        }
        group_name = buildRomGroup(brand, device, romType);
      }
      const payload = {
        category, group_name,
        title: document.getElementById("editTitle").value.trim(),
        url: document.getElementById("editUrl").value.trim(),
        updated_at: new Date().toISOString()
      };
      const { error } = await db.from("vault_files").update(payload).eq("id", id);
      if (error) { if (window.hidePageLoader) hidePageLoader(); showToast("Error: " + error.message); return; }
      closeEdit(); showToast("Saved"); await loadFiles();
      if (window.hidePageLoader) hidePageLoader();
    }

    async function deleteFile(id) {
      var okDel = await neoConfirm({ title: "Hapus file?", message: "File ini akan dihapus dari Vault. Tidak bisa dibatalkan.", okText: "Hapus" });
      if (!okDel) return;
      if (window.showPageLoader) showPageLoader("Menghapus...");
      const { error } = await db.from("vault_files").delete().eq("id", id);
      if (error) { if (window.hidePageLoader) hidePageLoader(); showToast("Error: " + error.message); return; }
      showToast("Deleted"); await loadFiles();
      // Refresh folder modal if open
      const fm = document.getElementById("folderModal");
      if (fm && fm.classList.contains("show")) renderFolderModalLists();
      if (window.hidePageLoader) hidePageLoader();
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2500);
    }

    // Transfer session when going back to Account Center
    (function () {
      const a = document.getElementById("linkBackAccount");
      if (!a) return;
      a.addEventListener("click", async function (e) {
        e.preventDefault();
        try {
          let access_token = null, refresh_token = null;
          try {
            const { data: { session } } = await db.auth.getSession();
            if (session) { access_token = session.access_token; refresh_token = session.refresh_token; }
          } catch (err) {}
          if (!access_token) {
            try {
              const raw = localStorage.getItem("sb-vsednhqbszdiwpazcoii-auth-token");
              if (raw) { const p = JSON.parse(raw); access_token = p.access_token; refresh_token = p.refresh_token; }
            } catch (err) {}
          }
          if (access_token) {
            const params = new URLSearchParams();
            params.set("access_token", access_token);
            if (refresh_token) params.set("refresh_token", refresh_token);
            window.location.href = getAccountHref() + "#" + params.toString();
            return;
          }
        } catch (err) {}
        window.location.href = getAccountHref();
      });
    })();

    // Path Account yang aman untuk file:// dan hosting
    function getAccountHref() {
      var p = (window.location.pathname || window.location.href || "").replace(/\\/g, "/");
      // vault/admin/index.html → ../../account/index.html
      // vault/admin.html → ../account/index.html
      if (p.indexOf("/vault/admin/") !== -1 || /\/admin\/index\.html$/i.test(p)) {
        return "../../account/index.html";
      }
      if (p.indexOf("/vault/") !== -1 || /admin\.html$/i.test(p)) {
        return "../account/index.html";
      }
      return "../account/index.html";
    }
    (function fixAccountLink() {
      var a = document.getElementById("linkBackAccount");
      if (a) a.setAttribute("href", getAccountHref());
    })();

    checkSession();
  </script>
<script>

    window.showPageLoader = function(msg) {
      var el = document.getElementById("pageLoader");
      var tx = document.getElementById("pageLoaderText");
      if (tx) tx.textContent = msg || "Loading...";
      if (el) el.classList.add("show");
    };
    window.hidePageLoader = function() {
      var el = document.getElementById("pageLoader");
      if (el) el.classList.remove("show");
    };
    document.addEventListener("DOMContentLoaded", function() {
      hidePageLoader();
      document.body.addEventListener("click", function(e) {
        var a = e.target.closest("a[href]");
        if (!a) return;
        var href = a.getAttribute("href") || "";
        if (!href || href.charAt(0) === "#" || href.indexOf("javascript:") === 0) return;
        if (a.target === "_blank" || a.hasAttribute("download")) return;
        if (/^https?:\/\//i.test(href) && href.indexOf(location.host) === -1) return;
        showPageLoader("Loading...");
      }, true);
    });
    window.addEventListener("pageshow", function() { hidePageLoader(); });

</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEOSHY — Vault & File Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>

    /* ── Micro-interactions (hover only, no continuous animation) ── */
    a, button, .btn, .btn-primary, .btn-ghost, .tab-btn, .dl-btn, .dl-link,
    .service-card, .feature-card, .shot-card, .file-item, .rom-folder, .rom-file,
    .account-btn, .tool-bridge a, .social-link, .chip-btn, .nav-links a {
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease, color 0.2s ease !important;
    }
    .btn-primary:hover, .btn.btn-primary:hover,
    a.btn-primary:hover, button.btn-primary:hover {
      transform: translateY(-2px) !important;
      box-shadow: 0 8px 28px rgba(59, 158, 255, 0.35) !important;
    }
    .btn-ghost:hover, a.btn-ghost:hover, button.btn-ghost:hover {
      transform: translateY(-1px) !important;
      border-color: rgba(59, 158, 255, 0.55) !important;
    }
    .service-card:hover, .feature-card:hover, .shot-card:hover,
    .rom-folder:hover, .file-item:hover, .rom-file:hover {
      transform: translateY(-3px) !important;
      border-color: rgba(59, 158, 255, 0.4) !important;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(59, 158, 255, 0.12) !important;
    }
    .tab-btn:hover, .dl-btn:hover, .dl-link:hover {
      transform: translateY(-1px) !important;
      box-shadow: 0 4px 16px rgba(59, 158, 255, 0.2) !important;
    }
    .nav-links a:hover {
      color: #3b9eff !important;
    }
    /* Hormati preferensi user yang tidak suka motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }

    :root {
      --bg: #0a0e17;
      --panel: rgba(16, 22, 36, 0.55);
      --card-bg: rgba(20, 28, 45, 0.45);
      --border: rgba(255, 255, 255, 0.10);
      --border-cyan: rgba(59, 158, 255, 0.28);
      --cyan: #3b9eff;
      --blue: #0078e0;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --font-main: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --radius: 16px;
      --glass: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    *::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }

    body {
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(0, 120, 224, 0.12), transparent),
        radial-gradient(ellipse 60% 40% at 80% 60%, rgba(59, 158, 255, 0.06), transparent);
      color: var(--text); font-family: var(--font-main);
      min-height: 100vh; padding-bottom: 120px; overflow-x: hidden; position: relative;
    }
    #particleCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px; position: relative; z-index: 1; }
    .hero {
      position: relative; text-align: center; padding: 50px 0 30px;
      background: radial-gradient(ellipse at 50% 20%, rgba(0, 120, 224, 0.1) 0%, transparent 60%);
      border-bottom: 1px solid var(--glass-border); z-index: 1;
    }
    .hero-logo-wrapper {
      position: relative; display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 25px; cursor: pointer;
    }
    .hero-logo-wrapper::before {
      content: ''; position: absolute; width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(59, 158, 255, 0.3) 0%, rgba(0, 120, 224, 0.1) 50%, transparent 70%);
      filter: blur(40px); z-index: -1; /* animation disabled for low CPU / Ultra Viewer */
    }
    .logo-card {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px) saturate(1.5);
      -webkit-backdrop-filter: blur(20px) saturate(1.5);
      padding: 18px; border-radius: 28px;
      display: inline-flex; align-items: center; justify-content: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.18), inset 0 -1px 1px rgba(0, 0, 0, 0.1);
      position: relative; overflow: hidden; /* floatLogo disabled for low CPU / Ultra Viewer */
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .logo-card:hover {
      border-color: rgba(59, 158, 255, 0.5);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45), 0 0 40px rgba(59, 158, 255, 0.2), inset 0 1px 2px rgba(255, 255, 255, 0.25);
      transform: translateY(-6px) scale(1.05);
    }
    .logo-card::after {
      content: ''; position: absolute; top: -50%; left: -150%; width: 60%; height: 200%;
      background: linear-gradient(60deg, transparent, rgba(59, 158, 255, 0.25), rgba(255, 255, 255, 0.4), transparent);
      transform: rotate(25deg); transition: all 0.75s ease; pointer-events: none;
    }
    .logo-card:hover::after { left: 150%; }
    .logo-img {
      width: 140px; height: 140px; object-fit: contain; border-radius: 16px; display: block;
      filter: invert(1) hue-rotate(180deg) drop-shadow(0 0 12px rgba(59, 158, 255, 0.45));
      mix-blend-mode: screen; transition: filter 0.3s ease;
    }
    .logo-card:hover .logo-img {
      filter: invert(1) hue-rotate(180deg) drop-shadow(0 0 22px rgba(59, 158, 255, 0.7)) brightness(1.1);
    }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(255, 255, 255, 0.06); border: 1px solid var(--glass-border);
      color: var(--cyan); padding: 7px 18px; border-radius: 30px;
      font-size: 13px; font-family: var(--font-mono); margin-bottom: 18px;
      backdrop-filter: blur(12px) saturate(1.3); -webkit-backdrop-filter: blur(12px) saturate(1.3);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }
    .hero-title { font-size: 40px; font-weight: 800; line-height: 1.2; }
    .hero-title span {
      background: linear-gradient(135deg, #fff 30%, var(--cyan));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    /* Bridge to Remote Tool */
    .tool-bridge {
      display: flex; justify-content: center; margin: 22px 0 0;
    }
    .tool-bridge a {
      display: inline-flex; align-items: center; gap: 10px;
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border);
      color: var(--cyan); padding: 12px 22px; border-radius: 14px; text-decoration: none;
      font-weight: 600; font-size: 14px; transition: all 0.25s;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    .tool-bridge a:hover {
      background: rgba(59, 158, 255, 0.12); border-color: rgba(59, 158, 255, 0.4);
      box-shadow: 0 4px 20px rgba(59, 158, 255, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }
    .tool-bridge a i.fa-arrow-right { font-size: 12px; transition: transform 0.2s; }
    .tool-bridge a:hover i.fa-arrow-right { transform: translateX(4px); }

    .filter-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin: 35px 0 25px; gap: 20px; flex-wrap: wrap;
    }
    .tabs {
      display: flex; gap: 6px; flex-wrap: wrap;
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.02));
      padding: 5px; border-radius: 14px; border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    .tab-btn {
      background: transparent; border: none; color: var(--text-muted);
      padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all 0.25s; font-family: var(--font-main);
    }
    .tab-btn.active, .tab-btn:hover {
      background: rgba(59, 158, 255, 0.12); color: var(--cyan);
    }

    /* ===== Rom & Recovery folder browser (Windows-style) ===== */
    .rom-browser {
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.015));
      border: 1px solid var(--glass-border); border-radius: var(--radius);
      padding: 16px 18px 22px; min-height: 280px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    .rom-breadcrumb {
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
      margin-bottom: 16px; padding: 10px 12px; border-radius: 10px;
      background: rgba(0, 0, 0, 0.25); border: 1px solid var(--border);
      font-size: 13px; font-family: var(--font-mono); color: var(--text-muted);
    }
    .rom-breadcrumb button {
      background: none; border: none; color: var(--cyan); cursor: pointer;
      font-family: inherit; font-size: inherit; padding: 2px 4px; border-radius: 4px;
    }
    .rom-breadcrumb button:hover { background: rgba(59, 158, 255, 0.15); }
    .rom-breadcrumb .sep { opacity: 0.4; }
    .rom-breadcrumb .current { color: #fff; font-weight: 600; }
    .rom-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 14px 10px;
    }
    .rom-folder, .rom-file {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 12px 8px; border-radius: 12px; cursor: pointer;
      border: 1px solid transparent; transition: all 0.2s; text-align: center;
      background: transparent; color: var(--text); font-family: var(--font-main);
    }
    .rom-folder:hover, .rom-file:hover {
      background: rgba(59, 158, 255, 0.08); border-color: rgba(59, 158, 255, 0.25);
    }
    .rom-folder-icon {
      width: 64px; height: 52px; position: relative;
      filter: drop-shadow(0 4px 12px rgba(59, 158, 255, 0.25));
    }
    .rom-folder-icon svg { width: 100%; height: 100%; }
    .rom-folder-name, .rom-file-name {
      font-size: 12.5px; font-weight: 600; line-height: 1.3;
      word-break: break-word; max-width: 100%;
    }
    .rom-folder-count {
      font-size: 10px; color: var(--text-muted); font-family: var(--font-mono);
    }
    .rom-file-icon {
      width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
      font-size: 28px; color: var(--cyan);
    }
    .rom-file a.dl-link {
      font-size: 11px; color: var(--cyan); text-decoration: none;
      padding: 4px 10px; border-radius: 8px; border: 1px solid rgba(59, 158, 255, 0.3);
      background: rgba(59, 158, 255, 0.08);
    }
    .rom-file a.dl-link:hover { background: rgba(59, 158, 255, 0.18); }
    .rom-empty {
      text-align: center; padding: 48px 20px; color: var(--text-muted); font-size: 14px;
    }
    .rom-empty i { font-size: 36px; display: block; margin-bottom: 12px; opacity: 0.5; }
    .rom-back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(59, 158, 255, 0.1); border: 1px solid rgba(59, 158, 255, 0.3);
      color: var(--cyan); padding: 6px 12px; border-radius: 8px; font-size: 12px;
      font-weight: 600; cursor: pointer; font-family: var(--font-main); margin-right: 8px;
    }
    .rom-back-btn:hover { background: rgba(59, 158, 255, 0.2); }
    .rom-note-card {
      grid-column: 1 / -1;
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px; border-radius: 12px; cursor: pointer; text-align: left;
      background: rgba(245, 197, 66, 0.08); border: 1px solid rgba(245, 197, 66, 0.35);
      color: #f5c542; font-family: var(--font-main); width: 100%;
    }
    .rom-note-card:hover { background: rgba(245, 197, 66, 0.14); }
    .rom-note-card i { font-size: 22px; flex-shrink: 0; }
    .rom-note-card .note-title { font-weight: 700; font-size: 13px; color: #f5c542; }
    .rom-note-card .note-hint { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .note-modal-overlay {
      position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.7);
      display: none; align-items: center; justify-content: center; padding: 20px;
      backdrop-filter: blur(6px);
    }
    .note-modal-overlay.show { display: flex; }
    .note-modal {
      background: #0f1624; border: 1px solid rgba(59, 158, 255, 0.35);
      border-radius: 16px; max-width: 520px; width: 100%; max-height: 80vh;
      overflow: auto; padding: 22px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .note-modal h3 {
      font-size: 16px; color: #f5c542; margin-bottom: 6px;
      display: flex; align-items: center; gap: 8px;
    }
    .note-modal .note-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; font-family: var(--font-mono); }
    .note-modal .note-body {
      white-space: pre-wrap; word-break: break-word; font-size: 13.5px;
      line-height: 1.55; color: var(--text); background: rgba(0,0,0,0.25);
      border: 1px solid var(--border); border-radius: 10px; padding: 14px; min-height: 80px;
    }
    .note-modal textarea {
      width: 100%; min-height: 160px; background: rgba(0,0,0,0.35);
      border: 1px solid rgba(59, 158, 255, 0.3); border-radius: 10px;
      color: #fff; padding: 12px; font-size: 13.5px; font-family: var(--font-main);
      line-height: 1.5; resize: vertical; outline: none;
    }
    .note-modal textarea:focus { border-color: var(--cyan); }
    .note-modal-actions {
      display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap;
    }
    .note-modal-actions button {
      padding: 8px 16px; border-radius: 10px; font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: var(--font-main); border: 1px solid transparent;
    }
    .btn-note-close {
      background: rgba(255,255,255,0.06); border-color: var(--glass-border) !important; color: var(--text-muted);
    }
    .btn-note-edit {
      background: rgba(59, 158, 255, 0.15); border-color: rgba(59, 158, 255, 0.4) !important; color: var(--cyan);
    }
    .btn-note-save {
      background: linear-gradient(135deg, #0078e0, #3b9eff); color: #fff; border: none !important;
    }
    .search-box { position: relative; width: 340px; max-width: 100%; }
    .search-box input {
      width: 100%;
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.02));
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-radius: 14px; padding: 10px 14px 10px 38px;
      color: #fff; font-size: 13.5px; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s; font-family: var(--font-main);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    .search-box input:focus { border-color: rgba(59, 158, 255, 0.45); box-shadow: 0 0 12px rgba(59, 158, 255, 0.15); }
    .search-box i { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    .group-card {
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.02));
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3);
      border-radius: var(--radius); margin-bottom: 20px; overflow: hidden;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 8px 24px rgba(0, 0, 0, 0.2);
    }
    .group-header {
      padding: 14px 20px; background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid var(--glass-border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .group-name { font-size: 14.5px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 10px; }
    .group-name i { color: var(--cyan); }
    .group-badge { font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); }
    .file-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 13px 20px; border-bottom: 1px solid var(--border);
      transition: background 0.2s; cursor: pointer; gap: 12px;
    }
    .file-item:last-child { border-bottom: none; }
    .file-item:hover { background: rgba(59, 158, 255, 0.06); }
    .file-item.selected { background: rgba(59, 158, 255, 0.12); }
    .file-left { display: flex; align-items: center; gap: 16px; min-width: 0; flex: 1; }
    .checkbox {
      width: 19px; height: 19px; border: 2px solid var(--text-muted); border-radius: 5px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .file-item.selected .checkbox { background: var(--cyan); border-color: var(--cyan); }
    .checkbox i { color: #0a0e17; font-size: 10px; display: none; }
    .file-item.selected .checkbox i { display: block; }
    .file-title { font-size: 14px; font-weight: 600; color: var(--text); word-break: break-word; }
    .dl-btn {
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); color: var(--cyan);
      padding: 7px 15px; border-radius: 10px; font-size: 12.5px; font-weight: 600;
      text-decoration: none; display: flex; align-items: center; gap: 6px; transition: all 0.25s; flex-shrink: 0;
      backdrop-filter: blur(8px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    .dl-btn:hover {
      background: linear-gradient(135deg, rgba(59, 158, 255, 0.85), rgba(0, 120, 224, 0.75));
      color: #0a0e17; border-color: rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 16px rgba(0, 120, 224, 0.25);
    }
    @keyframes floatLogo { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-7px); } }
    @keyframes pulseGlow { 0% { opacity: 0.35; transform: scale(0.88); } 100% { opacity: 0.85; transform: scale(1.12); } }
    .batch-bar {
      position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%) translateY(120px);
      background: rgba(16, 22, 36, 0.85); border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4);
      padding: 12px 28px; border-radius: 40px; display: flex; align-items: center; gap: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 1000;
    }
    .batch-bar.active { transform: translateX(-50%) translateY(0); }
    .batch-btn {
      background: linear-gradient(135deg, rgba(59, 158, 255, 0.85), rgba(0, 120, 224, 0.75));
      border: 1px solid rgba(255, 255, 255, 0.2); color: #0a0e17;
      font-weight: 700; padding: 10px 22px; border-radius: 25px; font-size: 13.5px;
      cursor: pointer; display: flex; align-items: center; gap: 8px; font-family: var(--font-main);
      box-shadow: 0 4px 16px rgba(0, 120, 224, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }
    .batch-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .admin-btn {
      position: fixed; bottom: 25px; right: 25px;
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.02));
      border: 1px solid var(--glass-border); color: var(--text-muted); padding: 11px 16px;
      border-radius: 14px; font-size: 13px; font-weight: 600; text-decoration: none;
      display: flex; align-items: center; gap: 7px;
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      transition: all 0.25s; z-index: 100; font-family: var(--font-main); cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    .admin-btn:hover { border-color: rgba(59, 158, 255, 0.4); color: var(--cyan); background: rgba(59, 158, 255, 0.1); }
    .admin-btn.logged-in {
      border-color: rgba(59, 158, 255, 0.35); color: var(--cyan); background: rgba(59, 158, 255, 0.1);
    }
    .neo-toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: rgba(10, 18, 32, 0.95); border: 1px solid rgba(59, 158, 255, 0.4);
      color: #e2e8f0; padding: 12px 20px; border-radius: 12px; font-size: 13px;
      font-family: var(--font-main); z-index: 99999; opacity: 0; pointer-events: none;
      transition: all 0.3s ease; max-width: 90vw; text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.45);
    }
    .neo-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .neo-toast.ok { border-color: rgba(52, 211, 153, 0.5); }
    .neo-toast.err { border-color: rgba(251, 113, 133, 0.5); }
    .neo-confirm-overlay {
      position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,0.7);
      display: none; align-items: center; justify-content: center; padding: 20px;
      backdrop-filter: blur(6px);
    }
    .neo-confirm-overlay.show { display: flex; }
    .neo-confirm-box {
      background: #0f1624; border: 1px solid rgba(59, 158, 255, 0.35);
      border-radius: 16px; max-width: 400px; width: 100%; padding: 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .neo-confirm-box h3 {

    #pageLoader {

    #pageLoader .pl-box {
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      padding: 22px 28px; border-radius: 18px;
      background: linear-gradient(160deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.12);

    #pageLoader .pl-text {
      font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #94a3b8;
    }
    @keyframes plSpin { to { transform: rotate(360deg); } }

  </style>
</head>
<body>

  <div id="pageLoader" aria-live="polite" aria-busy="true">
    <div class="pl-box">
      <div class="pl-spin"></div>
      <div class="pl-text" id="pageLoaderText">Loading...</div>
    </div>
  </div>

  <canvas id="particleCanvas"></canvas>
  <a href="../index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i> Home</a>

  <section class="hero">
    <div class="wrap">
      <div class="hero-logo-wrapper">
        <div class="logo-card">
          <img src="logo.png" alt="NEOSHY Logo" class="logo-img" onerror="this.style.display='none'">
        </div>
      </div>
      <br>
      <div class="hero-badge"><i class="fa-solid fa-shield-halved"></i> 100% CLEAN & TESTED REPOSITORY</div>
      <h1 class="hero-title">Download Tools & Modules<br><span>NeoShy.</span></h1>
      <div class="tool-bridge">
        <a href="../tools/index.html">
          <i class="fa-solid fa-mobile-screen-button"></i>
          Open NeoShy Remote Tool
          <i class="fa-solid fa-arrow-right"></i>
        </a>
      </div>
    </div>
  </section>

  <main class="wrap">
    <div class="filter-bar">
      <div class="tabs">
        <button class="tab-btn active" data-cat="all" onclick="filterTab('all', this)">All Files</button>
        <button class="tab-btn" data-cat="module" onclick="filterTab('module', this)">Modules</button>
        <button class="tab-btn" data-cat="tool" onclick="filterTab('tool', this)">Tools</button>
        <button class="tab-btn" data-cat="rom" onclick="filterTab('rom', this)">Rom &amp; Recovery</button>
      </div>
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search modules, tools..." oninput="filterAndSearch()">
      </div>
    </div>
    <div id="fileContainer">
      <div class="loading"><i class="fa-solid fa-spinner fa-spin"></i>Loading files...</div>
    </div>
  </main>

  <div class="batch-bar" id="batchBar">
    <div class="batch-info">Selected: <b id="selectedCount" style="color:var(--cyan)">0</b> Files</div>
    <button class="batch-btn" id="batchBtn" onclick="startBatchDownload()">
      <i class="fa-solid fa-cloud-arrow-down"></i> <span id="batchBtnText">Download Selected</span>
    </button>
  </div>

  <a href="../account/index.html" class="admin-btn" id="adminBtn" style="display:none">
    <i class="fa-solid fa-user-shield"></i> <span id="adminBtnText">Account Center</span>
  </a>

  <!-- Confirm popup custom -->
  <div class="neo-confirm-overlay" id="neoConfirmOverlay">
    <div class="neo-confirm-box" onclick="event.stopPropagation()">
      <h3 id="neoConfirmTitle">Konfirmasi</h3>
      <p id="neoConfirmMsg"></p>
      <div class="neo-confirm-actions">
        <button type="button" class="neo-btn-cancel" id="neoConfirmCancel">Batal</button>
        <button type="button" class="neo-btn-ok" id="neoConfirmOk">Oke</button>
      </div>
    </div>
  </div>

  <!-- Modal Note Recovery (admin only) -->
  <div class="note-modal-overlay" id="noteModal" onclick="if(event.target===this)closeNoteModal()">
    <div class="note-modal" onclick="event.stopPropagation()">
      <h3><i class="fa-solid fa-sticky-note"></i> Note Device</h3>
      <div class="note-sub" id="noteModalSub">—</div>
      <div id="noteViewMode">
        <div class="note-body" id="noteViewBody"></div>
        <div class="note-modal-actions">
          <button type="button" class="btn-note-close" onclick="closeNoteModal()">Tutup</button>
          <button type="button" class="btn-note-edit" onclick="noteStartEdit()"><i class="fa-solid fa-pen"></i> Edit</button>
        </div>
      </div>
      <div id="noteEditMode" style="display:none">
        <textarea id="noteEditArea" placeholder="Tulis catatan untuk tipe HP ini (cara flash, tips, dll)..."></textarea>
        <div class="note-modal-actions">
          <button type="button" class="btn-note-close" onclick="noteCancelEdit()">Batal</button>
          <button type="button" class="btn-note-save" onclick="noteSave()"><i class="fa-solid fa-floppy-disk"></i> Simpan</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://vsednhqbszdiwpazcoii.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZzZWRuaHFic3pkaXdwYXpjb2lpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMjEyMDYsImV4cCI6MjEwMjY5NzIwNn0.SO5nMDZOqsT_Cwp9x4_9CFHPsVPpyNgndb2k_qVn89o";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storage: window.localStorage }
    });

    let globalData = [];

    let currentCategory = "all";
    // Navigasi folder Rom & Recovery: { brand: null|string, device: null|string, type: null|'rom'|'recovery' }
    let romNav = { brand: null, device: null, type: null };
    let isAdminLoggedIn = false;
    let currentNoteItem = null; // { id, brand, device, text }

    const placeholders = {
      all: "Search modules, tools, rom...",
      module: "Search modules, tweaks, or apps...",
      tool: "Search flash tools, drivers, or ADB tools...",
      rom: "Search brand, device, atau nama file ROM..."
    };

    // group_name format: Brand|||Device|||rom  atau  Brand|||Device|||recovery
    function parseRomGroup(groupName) {
      if (!groupName) return null;
      const parts = String(groupName).split("|||");
      if (parts.length < 3) return null;
      return { brand: parts[0].trim(), device: parts[1].trim(), type: parts[2].trim().toLowerCase() };
    }

    async function checkSession() {
      try {
        const { data: { session } } = await db.auth.getSession();
        isAdminLoggedIn = !!(session && session.user);
        const btn = document.getElementById("adminBtn");
        if (isAdminLoggedIn && btn) {
          btn.style.display = "inline-flex";
          btn.classList.add("logged-in");
          document.getElementById("adminBtnText").textContent = "Account Center";
          btn.querySelector("i").className = "fa-solid fa-user-shield";
          btn.href = "../manage/account.html";
        }
      } catch (e) {
        isAdminLoggedIn = false;
        console.warn("checkSession", e);
      }
      return isAdminLoggedIn;
    }

    async function loadFiles() {
      const { data, error } = await db.from("vault_files").select("*").order("sort_order", { ascending: true });
      if (error) {
        document.getElementById("fileContainer").innerHTML =
          '<p style="color:#ff4d4d;text-align:center;padding:40px">Gagal memuat file dari database.<br><small>' + error.message + '</small></p>';
        globalData = [];
        return;
      }
      globalData = data || [];
      renderData(globalData);
    }

    function esc(str) {
      if (!str) return "";
      return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    function renderData(data) {
      const container = document.getElementById("fileContainer");
      container.innerHTML = "";
      if (!data.length) {
        container.innerHTML = '<div class="empty"><i class="fa-solid fa-folder-open" style="font-size:28px;display:block;margin-bottom:10px"></i>No files found</div>';
        return;
      }

      // Tab Rom & Recovery → tampilan folder
      if (currentCategory === "rom") {
        renderRomBrowser(data.filter(i => i.category === "rom"));
        return;
      }

      const moduleItems = data.filter(i => i.category === "module");
      const toolItems = data.filter(i => i.category === "tool");
      const romItems = data.filter(i => i.category === "rom");

      if (moduleItems.length > 0) {
        let itemsHTML = moduleItems.map(item => fileItemHTML(item)).join("");
        container.innerHTML +=
          '<div class="group-card cat-group" data-cat="module">' +
          '<div class="group-header"><div class="group-name"><i class="fa-solid fa-puzzle-piece"></i> Modules</div>' +
          '<span class="group-badge">' + moduleItems.length + ' File' + (moduleItems.length > 1 ? 's' : '') + '</span></div>' +
          '<div class="file-list">' + itemsHTML + '</div></div>';
      }

      // Ringkasan Rom di tab All (klik untuk buka tab Rom)
      if (romItems.length > 0 && currentCategory === "all") {
        const brands = new Set();
        romItems.forEach(i => { const p = parseRomGroup(i.group_name); if (p) brands.add(p.brand); });
        container.innerHTML +=
          '<div class="group-card cat-group" data-cat="rom" style="cursor:pointer" onclick="document.querySelector(\'.tab-btn[data-cat=rom]\').click()">' +
          '<div class="group-header"><div class="group-name"><i class="fa-solid fa-folder"></i> Rom &amp; Recovery</div>' +
          '<span class="group-badge">' + brands.size + ' Brand · ' + romItems.length + ' File</span></div>' +
          '<div class="file-list" style="padding:14px 20px;font-size:13px;color:var(--text-muted)">Buka folder</div></div>';
      }

      // Tools: flat list, tanpa sub-kategori/group
      if (toolItems.length > 0) {
        let itemsHTML = toolItems.map(item => fileItemHTML(item)).join("");
        container.innerHTML +=
          '<div class="group-card cat-group" data-cat="tool">' +
          '<div class="group-header"><div class="group-name"><i class="fa-solid fa-screwdriver-wrench"></i> Tools</div>' +
          '<span class="group-badge">' + toolItems.length + ' File' + (toolItems.length > 1 ? 's' : '') + '</span></div>' +
          '<div class="file-list">' + itemsHTML + '</div></div>';
      }
    }

    function fileItemHTML(item) {
      return '<div class="file-item" data-title="' + esc(item.title) + '" data-cat="' + item.category + '" data-url="' + esc(item.url) + '" onclick="toggleSelect(this)">' +
        '<div class="file-left"><div class="checkbox"><i class="fa-solid fa-check"></i></div><div>' +
        '<div class="file-title">' + esc(item.title) + '</div></div></div>' +
        '<a href="' + esc(item.url) + '" target="_blank" rel="noopener" class="dl-btn" onclick="event.stopPropagation()"><i class="fa-solid fa-download"></i> Download</a></div>';
    }

    function toggleSelect(item) {
      item.classList.toggle("selected");
      updateBatchBar();
    }

    function updateBatchBar() {
      const selected = document.querySelectorAll(".file-item.selected");
      const bar = document.getElementById("batchBar");
      document.getElementById("selectedCount").innerText = selected.length;
      selected.length > 0 ? bar.classList.add("active") : bar.classList.remove("active");
    }

    function folderIconSVG() {
      // Tema cyan/blue sesuai web NEOSHY
      return '<div class="rom-folder-icon"><svg viewBox="0 0 64 52" xmlns="http://www.w3.org/2000/svg">' +
        '<path d="M2 10c0-3.3 2.7-6 6-6h16l4 6h28c3.3 0 6 2.7 6 6v28c0 3.3-2.7 6-6 6H8c-3.3 0-6-2.7-6-6V10z" fill="#1a6fb5"/>' +
        '<path d="M2 16h60v28c0 3.3-2.7 6-6 6H8c-3.3 0-6-2.7-6-6V16z" fill="#0078e0"/>' +
        '<path d="M2 10c0-3.3 2.7-6 6-6h16l4 6H2v0z" fill="#3b9eff"/>' +
        '<path d="M8 22h48v3H8z" fill="rgba(255,255,255,0.12)"/>' +
        '</svg></div>';
    }

    function jsStr(s) {
      return String(s || "").replace(/\\/g, "\\\\").replace(/'/g, "\\'");
    }

    function buildRomTree(romItems) {
      const tree = {};
      romItems.forEach(item => {
        const p = parseRomGroup(item.group_name);
        if (!p) return;
        if (!tree[p.brand]) tree[p.brand] = {};
        if (!tree[p.brand][p.device]) tree[p.brand][p.device] = { rom: [], recovery: [], addon: [], note: null };
        if (p.type === "recovery_note") {
          tree[p.brand][p.device].note = item;
        } else if (p.type === "recovery") {
          tree[p.brand][p.device].recovery.push(item);
        } else if (p.type === "addon") {
          tree[p.brand][p.device].addon.push(item);
        } else {
          tree[p.brand][p.device].rom.push(item);
        }
      });
      return tree;
    }

    function romBack() {
      if (romNav.type) {
        romGo(romNav.brand, romNav.device, null);
      } else if (romNav.device) {
        romGo(romNav.brand, null, null);
      } else if (romNav.brand) {
        romGo(null, null, null);
      }
    }

    function renderRomBrowser(romItems) {
      const container = document.getElementById("fileContainer");
      const query = (document.getElementById("searchInput").value || "").toLowerCase().trim();
      const tree = buildRomTree(romItems);

      let filteredTree = tree;
      if (query) {
        filteredTree = {};
        Object.keys(tree).forEach(brand => {
          Object.keys(tree[brand]).forEach(device => {
            ["rom", "recovery", "addon"].forEach(type => {
              (tree[brand][device][type] || []).forEach(f => {
                const hay = (brand + " " + device + " " + type + " " + (f.title || "")).toLowerCase();
                if (!hay.includes(query)) return;
                if (!filteredTree[brand]) filteredTree[brand] = {};
                if (!filteredTree[brand][device]) filteredTree[brand][device] = { rom: [], recovery: [], addon: [], note: tree[brand][device].note };
                filteredTree[brand][device][type].push(f);
              });
            });
            if ((brand + " " + device).toLowerCase().includes(query)) {
              if (!filteredTree[brand]) filteredTree[brand] = {};
              if (!filteredTree[brand][device]) filteredTree[brand][device] = { rom: [], recovery: [], addon: [], note: tree[brand][device].note };
              else filteredTree[brand][device].note = tree[brand][device].note;
            }
          });
        });
      }

      let html = '<div class="rom-browser">';

      // Breadcrumb + Back
      html += '<div class="rom-breadcrumb">';
      if (romNav.brand) {
        html += '<button type="button" class="rom-back-btn" onclick="romBack()"><i class="fa-solid fa-arrow-left"></i> Kembali</button>';
      }
      html += '<button type="button" onclick="romGo(null,null,null)"><i class="fa-solid fa-hard-drive"></i> Rom &amp; Recovery</button>';
      if (romNav.brand) {
        html += '<span class="sep">/</span>';
        html += '<button type="button" onclick="romGo(\'' + jsStr(romNav.brand) + '\',null,null)">' + esc(romNav.brand) + '</button>';
      }
      if (romNav.device) {
        html += '<span class="sep">/</span>';
        html += '<button type="button" onclick="romGo(\'' + jsStr(romNav.brand) + '\',\'' + jsStr(romNav.device) + '\',null)">' + esc(romNav.device) + '</button>';
      }
      if (romNav.type) {
        html += '<span class="sep">/</span>';
        html += '<span class="current">' + (romNav.type === "recovery" ? "Recovery" : romNav.type === "addon" ? "Addon" : "ROM") + '</span>';
      }
      html += '</div>';

      html += '<div class="rom-grid">';

      if (!romNav.brand) {
        const brands = Object.keys(filteredTree).sort((a, b) => a.localeCompare(b));
        if (!brands.length) {
          html += '</div><div class="rom-empty"><i class="fa-solid fa-folder-open"></i>Kosong</div></div>';
          container.innerHTML = html;
          return;
        }
        brands.forEach(brand => {
          let count = 0;
          Object.keys(filteredTree[brand]).forEach(d => {
            const x = filteredTree[brand][d];
            count += x.rom.length + x.recovery.length + (x.addon ? x.addon.length : 0);
          });
          const devices = Object.keys(filteredTree[brand]).length;
          html += '<button type="button" class="rom-folder" onclick="romGo(\'' + jsStr(brand) + '\',null,null)">' +
            folderIconSVG() +
            '<span class="rom-folder-name">' + esc(brand) + '</span>' +
            '<span class="rom-folder-count">' + devices + ' device · ' + count + ' file</span></button>';
        });
      } else if (!romNav.device) {
        const devices = filteredTree[romNav.brand] ? Object.keys(filteredTree[romNav.brand]).sort((a, b) => a.localeCompare(b)) : [];
        if (!devices.length) {
          html += '</div><div class="rom-empty"><i class="fa-solid fa-folder-open"></i>Kosong</div></div>';
          container.innerHTML = html;
          return;
        }
        devices.forEach(device => {
          const d = filteredTree[romNav.brand][device];
          const count = d.rom.length + d.recovery.length + (d.addon ? d.addon.length : 0);
          html += '<button type="button" class="rom-folder" onclick="romGo(\'' + jsStr(romNav.brand) + '\',\'' + jsStr(device) + '\',null)">' +
            folderIconSVG() +
            '<span class="rom-folder-name">' + esc(device) + '</span>' +
            '<span class="rom-folder-count">' + count + ' file</span></button>';
        });
      } else if (!romNav.type) {
        const fullTreeForNote = buildRomTree(romItems);
        const d = (filteredTree[romNav.brand] && filteredTree[romNav.brand][romNav.device]) || { rom: [], recovery: [], addon: [], note: null };
        const dNote = (fullTreeForNote[romNav.brand] && fullTreeForNote[romNav.brand][romNav.device]) || d;
        // Note di level tipe HP (bukan di dalam Recovery) — data tetap recovery_note
        if (isAdminLoggedIn) {
          const noteText = dNote.note ? (dNote.note.url || dNote.note.title || "") : "";
          const noteId = dNote.note ? dNote.note.id : null;
          html += '<button type="button" class="rom-note-card" id="btnRecoveryNote">' +
            '<i class="fa-solid fa-sticky-note"></i>' +
            '<div><div class="note-title">📌 Note Device</div>' +
            '<div class="note-hint">Cara flash / catatan untuk ' + esc(romNav.device) + '</div></div></button>';
          window.__pendingNote = {
            brand: romNav.brand,
            device: romNav.device,
            id: noteId,
            text: noteText || ""
          };
        }
        html += '<button type="button" class="rom-folder" onclick="romGo(\'' + jsStr(romNav.brand) + '\',\'' + jsStr(romNav.device) + '\',\'rom\')">' +
          folderIconSVG() +
          '<span class="rom-folder-name">ROM</span>' +
          '<span class="rom-folder-count">' + d.rom.length + ' file</span></button>';
        html += '<button type="button" class="rom-folder" onclick="romGo(\'' + jsStr(romNav.brand) + '\',\'' + jsStr(romNav.device) + '\',\'recovery\')">' +
          folderIconSVG() +
          '<span class="rom-folder-name">Recovery</span>' +
          '<span class="rom-folder-count">' + d.recovery.length + ' file</span></button>';
        html += '<button type="button" class="rom-folder" onclick="romGo(\'' + jsStr(romNav.brand) + '\',\'' + jsStr(romNav.device) + '\',\'addon\')">' +
          folderIconSVG() +
          '<span class="rom-folder-name">Addon</span>' +
          '<span class="rom-folder-count">' + (d.addon ? d.addon.length : 0) + ' file</span></button>';
      } else {
        const fullTree = buildRomTree(romItems);
        const d = (fullTree[romNav.brand] && fullTree[romNav.brand][romNav.device]) || { rom: [], recovery: [], addon: [], note: null };
        const files = romNav.type === "recovery" ? d.recovery : romNav.type === "addon" ? (d.addon || []) : d.rom;


        // Admin: drop zone upload di halaman Vault
        if (isAdminLoggedIn) {
          html += '<div class="vault-drop-zone" id="vaultPublicDrop">' +
            '<i class="fa-solid fa-cloud-arrow-up" style="font-size:24px;color:var(--cyan);margin-bottom:6px;display:block"></i>' +
            '<div class="dz-title">Drop file ke sini</div>' +
            '<div class="dz-sub">atau klik untuk pilih · langsung masuk folder ini</div>' +
            '<input type="file" id="vaultPublicFileInput" multiple style="display:none">' +
            '<div id="vaultPublicProgress" class="vault-upload-progress" style="display:none">' +
            '<div class="vup-text">Mengupload...</div>' +
            '<div class="vup-bar"><div class="vup-fill" id="vaultPublicFill" style="width:0%"></div></div>' +
            '</div></div>';
        }

        if (!files.length && !(isAdminLoggedIn)) {
          html += '</div><div class="rom-empty"><i class="fa-solid fa-file"></i>Kosong</div></div>';
          container.innerHTML = html;
          bindNoteButton();
          return;
        }
        files.forEach(f => {
          html += '<div class="rom-file">' +
            '<div class="rom-file-icon"><i class="fa-solid fa-file-zipper"></i></div>' +
            '<span class="rom-file-name">' + esc(f.title) + '</span>' +
            '<div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center">' +
            '<a class="dl-link" href="' + esc(f.url) + '" target="_blank" rel="noopener"><i class="fa-solid fa-download"></i> Download</a>' +
            (isAdminLoggedIn
              ? '<button type="button" class="admin-del" onclick="deleteVaultFile(' + f.id + ')" title="Hapus"><i class="fa-solid fa-trash"></i></button>'
              : '') +
            '</div></div>';
        });
      }

      html += '</div></div>';
      container.innerHTML = html;
      bindNoteButton();
      bindPublicDropZone();
    }

    function bindNoteButton() {
      const btn = document.getElementById("btnRecoveryNote");
      if (!btn) return;
      btn.addEventListener("click", function(e) {
        e.preventDefault();
        e.stopPropagation();
        const n = window.__pendingNote || {};
        openRecoveryNote(n.brand, n.device, n.id, n.text);
      });
    }

    function bindPublicDropZone() {
      const zone = document.getElementById("vaultPublicDrop");
      const input = document.getElementById("vaultPublicFileInput");
      if (!zone || !input || !isAdminLoggedIn) return;
      zone.addEventListener("click", function(e) {
        if (e.target === input) return;
        input.click();
      });
      input.addEventListener("change", function() {
        if (input.files && input.files.length) handlePublicVaultFiles(input.files);
        input.value = "";
      });
      zone.addEventListener("dragover", function(e) {
        e.preventDefault();
        e.stopPropagation();
        zone.classList.add("drag-over");
      });
      zone.addEventListener("dragleave", function(e) {
        e.preventDefault();
        zone.classList.remove("drag-over");
      });
      zone.addEventListener("drop", function(e) {
        e.preventDefault();
        e.stopPropagation();
        zone.classList.remove("drag-over");
        if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
          handlePublicVaultFiles(e.dataTransfer.files);
        }
      });
    }

    function sanitizePathPart(s) {
      return String(s || "").replace(/[^a-zA-Z0-9._\-\s]/g, "").replace(/\s+/g, "_").slice(0, 80) || "x";
    }

    function buildRomGroup(brand, device, type) {
      return [brand.trim(), device.trim(), (type || "rom").toLowerCase()].join("|||");
    }

    var VAULT_ADDON_MAX_BYTES = 25 * 1024 * 1024; // 25 MB

    async function handlePublicVaultFiles(fileList) {
      if (!isAdminLoggedIn) {
        showNeoToast("Login admin dulu", "err");
        return;
      }
      if (!romNav.brand || !romNav.device || !romNav.type) {
        showNeoToast("Masuk ke folder dulu", "err");
        return;
      }
      let arr = Array.from(fileList);
      if (!arr.length) return;

      // Batas 25 MB khusus folder Addon
      if (romNav.type === "addon") {
        const tooBig = arr.filter(f => f.size > VAULT_ADDON_MAX_BYTES);
        if (tooBig.length) {
          const names = tooBig.map(f => f.name + " (" + (f.size / 1024 / 1024).toFixed(1) + " MB)").join(", ");
          showNeoToast("Addon max 25 MB. Ditolak: " + names, "err");
          await neoAlert("File terlalu besar", "Folder Addon maksimal 25 MB per file.\n\nDitolak: " + names + "\n\nPakai direct link untuk file besar.");
          arr = arr.filter(f => f.size <= VAULT_ADDON_MAX_BYTES);
          if (!arr.length) return;
        }
      }

      const prog = document.getElementById("vaultPublicProgress");
      const fill = document.getElementById("vaultPublicFill");
      const textEl = prog ? prog.querySelector(".vup-text") : null;
      if (prog) prog.style.display = "block";
      if (fill) fill.style.width = "0%";

      let ok = 0, fail = 0;
      for (let i = 0; i < arr.length; i++) {
        const pct = Math.round(((i) / arr.length) * 100);
        if (textEl) textEl.textContent = "Upload " + (i + 1) + " / " + arr.length + " — " + arr[i].name;
        if (fill) fill.style.width = pct + "%";
        try {
          await uploadPublicVaultFile(arr[i]);
          ok++;
        } catch (err) {
          fail++;
          showNeoToast("Gagal " + arr[i].name + ": " + (err.message || err), "err");
        }
        if (fill) fill.style.width = Math.round(((i + 1) / arr.length) * 100) + "%";
      }
      if (textEl) textEl.textContent = ok ? "Selesai — " + ok + " file" : "Gagal upload";
      setTimeout(function() { if (prog) prog.style.display = "none"; }, 800);
      if (ok) showNeoToast(ok + " file diupload" + (fail ? " (" + fail + " gagal)" : ""), "ok");
      await loadFiles();
      if (currentCategory === "rom") {
        renderRomBrowser(globalData.filter(i => i.category === "rom"));
      }
    }

    async function uploadPublicVaultFile(file) {
      const brand = sanitizePathPart(romNav.brand);
      const device = sanitizePathPart(romNav.device);
      const type = romNav.type;
      const safeName = file.name.replace(/[^a-zA-Z0-9._\-]/g, "_");
      const path = brand + "/" + device + "/" + type + "/" + Date.now() + "_" + safeName;

      const { error: upErr } = await db.storage.from("vault").upload(path, file, {
        cacheControl: "3600",
        upsert: false,
        contentType: file.type || "application/octet-stream"
      });
      if (upErr) throw upErr;

      const { data: urlData } = db.storage.from("vault").getPublicUrl(path);
      const publicUrl = urlData && urlData.publicUrl;
      if (!publicUrl) throw new Error("Gagal dapat URL");

      const maxOrder = globalData.reduce((m, f) => Math.max(m, f.sort_order || 0), 0);
      const { error: dbErr } = await db.from("vault_files").insert({
        category: "rom",
        group_name: buildRomGroup(romNav.brand, romNav.device, romNav.type),
        title: file.name,
        url: publicUrl,
        sort_order: maxOrder + 1
      });
      if (dbErr) throw dbErr;
    }

    function neoConfirm(opts) {
      opts = opts || {};
      return new Promise(function(resolve) {
        var el = document.getElementById("neoConfirmOverlay");
        if (!el) { resolve(window.confirm(opts.message || "Yakin?")); return; }
        document.getElementById("neoConfirmTitle").textContent = opts.title || "Konfirmasi";
        document.getElementById("neoConfirmMsg").textContent = opts.message || "Yakin lanjut?";
        var okBtn = document.getElementById("neoConfirmOk");
        var cancelBtn = document.getElementById("neoConfirmCancel");
        okBtn.textContent = opts.okText || "Oke";
        cancelBtn.textContent = opts.cancelText || "Batal";
        cancelBtn.style.display = opts.hideCancel ? "none" : "";
        okBtn.className = opts.danger ? "neo-btn-danger" : "neo-btn-ok";
        el.classList.add("show");
        function done(val) {
          el.classList.remove("show");
          okBtn.onclick = null;
          cancelBtn.onclick = null;
          resolve(val);
        }
        okBtn.onclick = function() { done(true); };
        cancelBtn.onclick = function() { done(false); };
        el.onclick = function(e) { if (e.target === el) done(false); };
      });
    }
    function neoAlert(title, message) {
      return neoConfirm({ title: title || "Info", message: message || "", okText: "Oke", hideCancel: true });
    }

    async function deleteVaultFile(id) {
      if (!isAdminLoggedIn) return;
      var ok = await neoConfirm({
        title: "Hapus file?",
        message: "File ini akan dihapus dari Vault. Tidak bisa dibatalkan.",
        okText: "Hapus",
        danger: true
      });
      if (!ok) return;
      const { error } = await db.from("vault_files").delete().eq("id", id);
      if (error) {
        showNeoToast("Gagal hapus: " + error.message, "err");
        return;
      }
      showNeoToast("File dihapus", "ok");
      await loadFiles();
      if (currentCategory === "rom") {
        renderRomBrowser(globalData.filter(i => i.category === "rom"));
      }
    }

    async function romGo(brand, device, type) {
      romNav = { brand: brand || null, device: device || null, type: type || null };
      if (type) await checkSession();
      renderRomBrowser(globalData.filter(i => i.category === "rom"));
    }

    async function openRecoveryNote(brand, device, noteId, noteText) {
      await checkSession();
      if (!isAdminLoggedIn) {
        showNeoToast("Login admin dulu untuk lihat / edit note recovery.", "err");
        return;
      }
      currentNoteItem = { id: noteId || null, brand: brand, device: device, text: noteText || "" };
      const overlay = document.getElementById("noteModal");
      if (!overlay) {
        showNeoToast("Modal note tidak ditemukan. Update file vault/index.html.", "err");
        return;
      }
      document.getElementById("noteModalSub").textContent = brand + " / " + device;
      document.getElementById("noteViewBody").textContent = noteText && String(noteText).trim()
        ? noteText
        : "(Belum ada note. Klik Edit untuk menulis catatan device ini.)";
      document.getElementById("noteEditArea").value = noteText || "";
      document.getElementById("noteViewMode").style.display = "";
      document.getElementById("noteEditMode").style.display = "none";
      overlay.classList.add("show");
    }

    function closeNoteModal() {
      document.getElementById("noteModal").classList.remove("show");
      currentNoteItem = null;
    }

    function noteStartEdit() {
      document.getElementById("noteViewMode").style.display = "none";
      document.getElementById("noteEditMode").style.display = "";
      document.getElementById("noteEditArea").focus();
    }

    function noteCancelEdit() {
      document.getElementById("noteViewMode").style.display = "";
      document.getElementById("noteEditMode").style.display = "none";
    }

    async function noteSave() {
      if (!isAdminLoggedIn || !currentNoteItem) return;
      const text = document.getElementById("noteEditArea").value;
      const group_name = currentNoteItem.brand + "|||" + currentNoteItem.device + "|||recovery_note";
      try {
        if (currentNoteItem.id) {
          const { error } = await db.from("vault_files").update({
            title: "Recovery Note",
            url: text,
            group_name: group_name,
            category: "rom",
            updated_at: new Date().toISOString()
          }).eq("id", currentNoteItem.id);
          if (error) throw error;
        } else {
          const maxOrder = globalData.reduce((m, f) => Math.max(m, f.sort_order || 0), 0);
          const { data, error } = await db.from("vault_files").insert({
            category: "rom",
            group_name: group_name,
            title: "Recovery Note",
            url: text,
            sort_order: maxOrder + 1
          }).select("id").single();
          if (error) throw error;
          currentNoteItem.id = data && data.id;
        }
        // Refresh local data
        await loadFiles();
        // Stay on same folder
        if (currentCategory === "rom") {
          renderRomBrowser(globalData.filter(i => i.category === "rom"));
        }
        currentNoteItem.text = text;
        document.getElementById("noteViewBody").textContent = text.trim() || "(Kosong)";
        noteCancelEdit();
        showNeoToast("Note disimpan.", "ok");
      } catch (e) {
        showNeoToast("Gagal simpan note: " + (e.message || e), "err");
      }
    }

    function showNeoToast(msg, type) {
      let t = document.getElementById("neoToast");
      if (!t) {
        t = document.createElement("div");
        t.id = "neoToast";
        t.className = "neo-toast";
        document.body.appendChild(t);
      }
      t.textContent = msg;
      t.className = "neo-toast show" + (type === "ok" ? " ok" : type === "err" ? " err" : "");
      clearTimeout(t._timer);
      t._timer = setTimeout(function() { t.classList.remove("show"); }, 2800);
    }

    async function filterTab(category, btn) {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentCategory = category;
      document.getElementById("searchInput").placeholder = placeholders[category] || placeholders.all;
      // Reset navigasi folder saat pindah tab
      if (category === "rom") {
        romNav = { brand: null, device: null, type: null };
        await checkSession();
        renderRomBrowser(globalData.filter(i => i.category === "rom"));
        return;
      }
      // Re-render full list for other tabs
      renderData(globalData);
      filterAndSearch();
    }

    function filterAndSearch() {
      if (currentCategory === "rom") {
        renderRomBrowser(globalData.filter(i => i.category === "rom"));
        return;
      }
      const query = document.getElementById("searchInput").value.toLowerCase();
      document.querySelectorAll(".cat-group").forEach(group => {
        const groupCat = group.getAttribute("data-cat");
        const matchCategory = (currentCategory === "all" || groupCat === currentCategory);
        if (!matchCategory) { group.style.display = "none"; return; }
        // Rom summary card on All tab: always show if category matches
        if (groupCat === "rom") {
          group.style.display = matchCategory ? "block" : "none";
          return;
        }
        let visible = 0;
        group.querySelectorAll(".file-item").forEach(item => {
          const title = (item.getAttribute("data-title") || "").toLowerCase();
          const match = title.includes(query);
          item.style.display = match ? "flex" : "none";
          if (match) visible++;
        });
        group.style.display = visible > 0 ? "block" : "none";
      });
    }

    function startBatchDownload() {
      const selected = document.querySelectorAll(".file-item.selected");
      if (!selected.length) return;
      const btn = document.getElementById("batchBtn");
      const btnText = document.getElementById("batchBtnText");
      btn.disabled = true;
      selected.forEach((item, index) => {
        const url = item.getAttribute("data-url");
        if (!url) return;
        setTimeout(() => {
          btnText.innerText = "Downloading (" + (index + 1) + "/" + selected.length + ")...";
          const iframe = document.createElement("iframe");
          iframe.style.display = "none";
          iframe.src = url;
          document.body.appendChild(iframe);
          setTimeout(() => { if (document.body.contains(iframe)) document.body.removeChild(iframe); }, 30000);
          if (index === selected.length - 1) {
            setTimeout(() => { btn.disabled = false; btnText.innerText = "Download Selected"; }, 1200);
          }
        }, index * 1200);
      });
    }

    // Particle OFF by default — hemat CPU biar Ultra Viewer tidak putus.
    // Aktifkan: localStorage.setItem("neoshy_particles","1") lalu refresh
    (function() {
      var canvas = document.getElementById("particleCanvas");
      if (!canvas) return;
      if (localStorage.getItem("neoshy_particles") !== "1") {
        canvas.style.display = "none";
        return;
      }
      var ctx = canvas.getContext("2d");
      var particles = [], animId = null, isVisible = true;
      function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
      window.addEventListener("resize", resize); resize();
      var n = Math.min(16, Math.max(6, Math.floor((canvas.width * canvas.height) / 60000)));
      for (var i = 0; i < n; i++) {
        particles.push({
          x: Math.random() * canvas.width, y: Math.random() * canvas.height,
          size: Math.random() * 1.2 + 0.3,
          sx: (Math.random() - 0.5) * 0.25, sy: (Math.random() - 0.5) * 0.25
        });
      }
      function tick() {
        if (!isVisible) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          p.x += p.sx; p.y += p.sy;
          if (p.x > canvas.width) p.x = 0; if (p.x < 0) p.x = canvas.width;
          if (p.y > canvas.height) p.y = 0; if (p.y < 0) p.y = canvas.height;
          ctx.fillStyle = "rgba(59,158,255,0.4)";
          ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
        }
        animId = requestAnimationFrame(tick);
      }
      document.addEventListener("visibilitychange", function() {
        isVisible = !document.hidden;
        if (isVisible && !animId) tick();
        if (!isVisible && animId) { cancelAnimationFrame(animId); animId = null; }
      });
      tick();
    })();

    // Session dulu, baru load files — supaya isAdminLoggedIn sudah benar
    (async function initVault() {
      await checkSession();
      await loadFiles();
    })();
  </script>
<script>

    window.showPageLoader = function(msg) {
      var el = document.getElementById("pageLoader");
      var tx = document.getElementById("pageLoaderText");
      if (tx) tx.textContent = msg || "Loading...";
      if (el) el.classList.add("show");
    };
    window.hidePageLoader = function() {
      var el = document.getElementById("pageLoader");
      if (el) el.classList.remove("show");
    };
    document.addEventListener("DOMContentLoaded", function() {
      hidePageLoader();
      document.body.addEventListener("click", function(e) {
        var a = e.target.closest("a[href]");
        if (!a) return;
        var href = a.getAttribute("href") || "";
        if (!href || href.charAt(0) === "#" || href.indexOf("javascript:") === 0) return;
        if (a.target === "_blank" || a.hasAttribute("download")) return;
        if (/^https?:\/\//i.test(href) && href.indexOf(location.host) === -1) return;
        showPageLoader("Loading...");
      }, true);
    });
    window.addEventListener("pageshow", function() { hidePageLoader(); });

</script>

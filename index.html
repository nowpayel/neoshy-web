<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEOSHY — Control Center</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #070a12;
      --panel: rgba(17, 23, 38, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --border-cyan: rgba(0, 217, 255, 0.35);
      --cyan: #00d9ff;
      --blue: #0077ff;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --font-main: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Background glow */
    body::before {
      content: '';
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 600px;
      background: radial-gradient(circle, rgba(0, 217, 255, 0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1000px;
      text-align: center;
    }

    /* Logo */
    .logo-wrapper {
      margin-bottom: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .logo-wrapper::before {
      content: '';
      position: absolute;
      width: 160px;
      height: 160px;
      background: radial-gradient(circle, rgba(0, 217, 255, 0.4) 0%, transparent 70%);
      filter: blur(30px);
      z-index: -1;
      animation: pulse 3s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.6; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1.05); }
    }

    .logo {
      width: 90px;
      height: 90px;
      border-radius: 22px;
      border: 1px solid var(--border-cyan);
      background: rgba(13, 19, 33, 0.8);
      object-fit: contain;
      padding: 10px;
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #fff 30%, var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 50px;
      font-family: var(--font-mono);
    }

    /* Cards Grid */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      margin-top: 10px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 28px;
      text-align: left;
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(0, 217, 255, 0.08), transparent 60%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .card:hover {
      border-color: var(--border-cyan);
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 30px rgba(0, 217, 255, 0.1);
    }

    .card:hover::before {
      opacity: 1;
    }

    .card-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: rgba(0, 217, 255, 0.1);
      border: 1px solid rgba(0, 217, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: var(--cyan);
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .card p {
      color: var(--text-muted);
      font-size: 0.88rem;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-family: var(--font-mono);
      color: var(--cyan);
      font-weight: 500;
    }

    .card-footer i {
      font-size: 0.7rem;
      transition: transform 0.2s ease;
    }

    .card:hover .card-footer i {
      transform: translateX(4px);
    }

    /* Footer */
    .footer {
      margin-top: 60px;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

      h1
